<style>

* { box-sizing: border-box; }
body { margin:0; background: radial-gradient(1100px 480px at 90% -10%, color-mix(in srgb, var(--p1) 14%, transparent), transparent 70%), radial-gradient(900px 480px at -10% 0, color-mix(in srgb, var(--p0) 16%, transparent), transparent 70%), var(--bg); background-attachment: fixed;
  color: var(--ink); font: 17px/1.55 var(--f-b); padding: 18px max(16px, env(safe-area-inset-right)) 60px max(16px, env(safe-area-inset-left)); }

p { margin: 0; } button { font: inherit; color: inherit; cursor: pointer; }

.stack { display: flex; flex-direction: column; gap: 16px; }

.m6 li b::before { content: counter(g) ". "; color: var(--c); } .m6 b { color: var(--ink); }
.m6 li:nth-child(1){--c:var(--p0)} .m6 li:nth-child(2){--c:var(--p1)} .m6 li:nth-child(3){--c:var(--p2)} .m6 li:nth-child(4){--c:var(--p3)} .m6 li:nth-child(5){--c:var(--p4)} .m6 li:nth-child(6){--c:var(--p5)}
.trap { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; } .trap li { padding-left: 1.4rem; position: relative; } .trap li::before { content: "⚠"; position: absolute; left: 0; color: var(--p2); }
details > summary { cursor: pointer; font-weight: 700; min-height: 44px; display: flex; align-items: center; list-style: none; } details > summary::-webkit-details-marker { display: none; }
details > summary::after { content: "＋"; margin-left: auto; color: var(--accent); } details[open] > summary::after { content: "－"; }

.top { position: sticky; top: 0; z-index: 3; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(6px); padding: 8px 0; display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; }
.timer { font: 700 20px var(--f-m); font-variant-numeric: tabular-nums; } .timer.low { color: var(--bad); }
.cnt { font: 700 14px var(--f-m); color: var(--muted); }

.opt .l { color: #fff; background: var(--c); border-radius: 9px; width: 2rem; height: 2rem; display: grid; place-items: center; font: 700 15px var(--f-m); }
.opt:nth-child(1){--c:var(--p0)} .opt:nth-child(2){--c:var(--p1)} .opt:nth-child(3){--c:var(--p2)} .opt:nth-child(4){--c:var(--p3)} .opt:nth-child(5){--c:var(--p5)}
.opt:hover:not(:disabled) { border-color: var(--c); } .opt:disabled { cursor: default; }
.opt.sel { border-color: var(--p0); background: color-mix(in srgb, var(--p0) 13%, var(--surface)); }
.opt.ok { border-color: var(--ok); background: var(--ok-soft); } .opt.bad { border-color: var(--bad); background: var(--bad-soft); }
.opt.struck { opacity: .5; text-decoration: line-through; }
.qbar { height: 6px; } .qbar i { background: linear-gradient(90deg, var(--p2), var(--p1)); transition: width 1s linear; }
.panel.tip p { margin: 0; }
.nav { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.mini { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.panel { border-radius: 14px; padding: 14px 16px; border: 2px solid var(--c); background: color-mix(in srgb, var(--c) 10%, var(--surface)); display: flex; flex-direction: column; gap: 6px; }
.panel b.t { font: 700 12px var(--f-m); letter-spacing: .06em; text-transform: uppercase; color: var(--c); }
.panel.ok { --c: var(--ok); } .panel.bad { --c: var(--bad); } .panel.me { --c: var(--p2); } .panel.ex { --c: var(--p3); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(42px,1fr)); gap: 6px; }
.grid button { min-height: 42px; border: 2px solid var(--line); border-radius: 9px; background: var(--surface); font: 700 13px var(--f-m); }
.grid .done { background: color-mix(in srgb, var(--p4) 25%, var(--surface)); border-color: var(--p4); } .grid .cur { box-shadow: 0 0 0 3px var(--accent); } .grid .fl { border-color: var(--p2); border-style: dashed; }
.score { font: 700 clamp(3rem, 14vw, 4.6rem)/1 var(--f-d); background: linear-gradient(135deg, var(--p0), var(--p1)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.th { display: grid; grid-template-columns: 7rem minmax(0,1fr) 3.2rem; gap: 8px; align-items: center; font-size: .9rem; }
.th .tr { height: 12px; border-radius: 6px; background: var(--line); overflow: hidden; } .th .tr i { display: block; height: 100%; }
.th b { text-align: right; font-family: var(--f-m); }
.rv { border: 2px solid var(--line); border-left: 7px solid var(--c); border-radius: 14px; background: var(--surface); padding: 0 14px; }
.rv.okq { --c: var(--ok); } .rv.koq { --c: var(--bad); } .rv.nq { --c: var(--p2); }
.rv .in { padding: 4px 0 14px; display: flex; flex-direction: column; gap: 10px; }
.rv .opt { min-height: 0; padding: 8px 10px; }
.tabs { display: flex; gap: 8px; flex-wrap: wrap; } .tabs button { border: 2px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; font-weight: 700; min-height: 40px; } .tabs .on { border-color: var(--p0); background: color-mix(in srgb, var(--p0) 14%, var(--surface)); }
.hist { display: flex; align-items: flex-end; gap: 6px; height: 90px; } .hist i { flex: 1; min-width: 8px; border-radius: 5px 5px 0 0; background: linear-gradient(180deg, var(--p0), var(--p1)); }
@media (min-width: 720px) { .nav { grid-template-columns: 200px 200px; justify-content: space-between; } }
.at { width: 100%; border-collapse: collapse; font-size: .95rem; } .at th, .at td { text-align: left; vertical-align: top; padding: 7px 8px; border-top: 1px solid var(--line); } .at th { width: 34%; font-weight: 600; } .at th.main { color: var(--p0); font-weight: 800; }

<script>
/* Banque A : thèmes 1 à 4. Format : [question, BONNE, piège1, piège2, piège3, piège4, explication, méthode] */
var BA = {
1: [
["Un stagiaire en électricité affirme « j'ai tout compris » puis échoue au montage. Quelle notion métacognitive explique le mieux l'écart entre son impression et sa performance ?",
 "Un défaut de calibration : son jugement de maîtrise est surestimé par rapport à sa performance réelle",
 "Une charge cognitive intrinsèque trop faible pour le contenu proposé",
 "Un transfert négatif venu d'un apprentissage antérieur",
 "Une motivation extrinsèque insuffisante pour persévérer",
 "Une mauvaise automatisation des gestes de base",
 "La calibration est l'accord entre ce que l'on croit savoir et ce que l'on sait réellement. Ici l'impression de maîtrise ne correspond pas au résultat : c'est une illusion de maîtrise.",
 "Repère l'écart « je crois / je réussis ». Dès que la question oppose le sentiment de savoir à la performance, pense calibration. Les autres notions ne parlent pas de ce que l'apprenant pense de lui-même."],
["Dans le modèle de Flavell, un stagiaire sait qu'il retient mieux un geste quand il le refait lui-même que lorsqu'il lit la consigne. De quoi s'agit-il ?",
 "D'une connaissance métacognitive portant sur la personne",
 "D'une connaissance métacognitive portant sur la tâche",
 "D'une régulation de type planification",
 "D'une régulation de type évaluation finale",
 "D'une connaissance conditionnelle sur la stratégie",
 "Il s'agit d'un savoir stable sur son propre fonctionnement (comment j'apprends). C'est la connaissance de la personne. La tâche concernerait la difficulté du travail, la stratégie concernerait les moyens d'agir.",
 "Pose-toi : « sur quoi porte le savoir ? » Soi (personne), le travail (tâche) ou la façon de s'y prendre (stratégie). Ici c'est « moi ». Ne te laisse pas attirer par les mots planification ou évaluation : ce sont des régulations, donc des actes, pas des savoirs."],
["En plein serrage, un stagiaire s'arrête, constate que le couple n'est pas conforme et change de méthode. Quelle composante de la régulation métacognitive observe-t-on ?",
 "Le contrôle en cours d'action (monitoring) suivi d'un ajustement",
 "La planification initiale de la tâche",
 "L'évaluation finale du produit",
 "Le transfert vers une nouvelle situation",
 "L'automatisation d'une procédure connue",
 "Surveiller sa propre exécution pendant l'action et corriger la stratégie relève du contrôle (monitoring). La planification se fait avant, l'évaluation après.",
 "Repère le moment : avant = planification, pendant = contrôle, après = évaluation. Le verbe « s'arrête en plein serrage » situe l'action pendant la tâche."],
["Quelle pratique du formateur rend le mieux visible le raisonnement d'un expert à un novice ?",
 "Réaliser le geste en pensant à voix haute et en justifiant chaque choix",
 "Distribuer le corrigé détaillé de l'exercice",
 "Faire répéter le geste sans commentaire jusqu'à l'automatisme",
 "Donner un cours magistral sur la théorie du geste",
 "Proposer un QCM final sur les étapes de la procédure",
 "La verbalisation à voix haute (modélisation) expose l'invisible : les critères de décision, les vérifications, les hésitations de l'expert. Le corrigé ne montre que le résultat.",
 "Cherche l'option qui rend visible le processus mental et pas seulement le résultat. Corrigé, QCM et répétition silencieuse cachent le raisonnement."],
["L'entretien d'explicitation (Vermersch) vise surtout à :",
 "Faire décrire précisément le déroulement de l'action vécue, en privilégiant le « comment » au « pourquoi »",
 "Faire justifier les causes d'un échec pour en trouver le responsable",
 "Évaluer la qualité de la réalisation par un jugement du formateur",
 "Tester les connaissances théoriques du stagiaire",
 "Déterminer le style d'apprentissage dominant",
 "Vermersch cherche à faire verbaliser l'action réelle, étape par étape, sans jugement. Le « pourquoi » pousse à justifier et à rationaliser, ce que l'on évite.",
 "Mot-clé à retenir : « comment, pas pourquoi ». Toute option centrée sur un jugement, une cause à justifier ou un test est un piège."],
["Selon Zimmerman, un carnet que le stagiaire remplit avant l'atelier (objectif, plan, stratégie prévue) correspond à quelle phase de l'autorégulation ?",
 "La phase d'anticipation (planification)",
 "La phase de réalisation",
 "La phase d'autoréflexion",
 "La phase de transfert",
 "La phase de consolidation",
 "Les trois phases de Zimmerman sont l'anticipation, la réalisation et l'autoréflexion. Fixer un but et prévoir une stratégie avant d'agir relève de l'anticipation.",
 "Repère l'adverbe de temps « avant ». Zimmerman = anticipation, réalisation, autoréflexion (3 phases seulement : élimine « transfert » et « consolidation »)."],
["Un formateur retire progressivement son aide à mesure que le stagiaire gagne en autonomie sur un geste. Quel terme de l'apprentissage cognitif (Collins, Brown, Newman) le décrit ?",
 "L'estompage (fading)",
 "La modélisation",
 "L'articulation",
 "L'exploration",
 "La contextualisation",
 "Dans l'apprentissage cognitif, le formateur modélise, accompagne, puis estompe son aide. Retirer l'étayage progressivement est l'estompage.",
 "Cherche le verbe de la question : « retire progressivement ». Le mot exact est estompage (ou fading), c'est le contraire de renforcer l'aide."],
["Quelle activité développe le mieux la calibration métacognitive d'un stagiaire avant un contrôle pratique ?",
 "Lui demander de prédire sa réussite par critère, puis de comparer ses prédictions au résultat observé",
 "Lui donner le corrigé immédiatement après l'essai",
 "Multiplier les exercices identiques jusqu'à la réussite",
 "Supprimer tout feedback pour développer son autonomie",
 "Lui attribuer une note collective pour réduire le stress",
 "Prédire puis comparer entraîne l'apprenant à ajuster son jugement de maîtrise, c'est le principe de la calibration. Les autres actions ne l'obligent pas à confronter sa croyance à la réalité.",
 "Une bonne réponse métacognitive oblige à confronter ce que l'on croit avec ce qui est. Repère « prédire puis comparer »."],
["Un expert en atelier exécute ses gestes sans réfléchir et explique mal à ses stagiaires. Quel phénomène est en jeu ?",
 "L'angle mort de l'expert : ses procédures automatisées sont devenues inconscientes et difficiles à verbaliser",
 "L'effet Dunning-Kruger",
 "Le biais de confirmation",
 "L'effet Pygmalion",
 "La dissonance cognitive",
 "Quand un geste est automatisé, l'expert n'a plus accès à ses étapes. Il oublie ce qui est difficile pour un novice. Remède : décomposer et expliciter.",
 "Distingue : Dunning-Kruger = les incompétents se surestiment. Angle mort = l'expert sous-estime la difficulté du novice. Ici c'est l'expert qui explique mal."],
["Des stagiaires faibles surestiment nettement leur niveau. Quelle intervention est la plus cohérente avec la métacognition ?",
 "Un feedback factuel appuyé sur des critères observables et une autoévaluation guidée par une grille",
 "Les féliciter pour préserver leur confiance",
 "Supprimer les autoévaluations pour éviter l'effet négatif",
 "Augmenter la difficulté sans explication",
 "Leur donner uniquement des notes finales",
 "Des critères observables et une autoévaluation guidée permettent de confronter perception et réalité. Féliciter ou supprimer l'autoévaluation entretient l'illusion.",
 "Quand l'écart perception-réalité est le problème, la solution est un outil qui confronte les deux : grille de critères plus autoévaluation."],
["Après un échec, quelle question de formateur favorise le plus la régulation métacognitive ?",
 "« Qu'est-ce qui t'a fait choisir cette méthode, et que changerais-tu la prochaine fois ? »",
 "« Pourquoi t'es-tu trompé ? »",
 "« Tu as compris, cette fois ? »",
 "« Qui t'a appris à faire comme ça ? »",
 "« Combien de temps as-tu mis ? »",
 "La question invite à décrire le choix, à l'analyser et à planifier un ajustement. « Pourquoi t'es-tu trompé ? » incite à se justifier.",
 "Élimine les questions fermées (« tu as compris ? »), celles qui accusent et celles qui mesurent. Garde celle qui relie décision, analyse et plan d'action."],
["Savoir quand utiliser une procédure de consignation plutôt qu'une autre, selon le contexte de l'intervention, correspond à quelle connaissance (Schraw et Dennison) ?",
 "La connaissance conditionnelle",
 "La connaissance déclarative",
 "La connaissance procédurale",
 "La connaissance épisodique",
 "La connaissance sémantique",
 "Les trois connaissances métacognitives sont déclarative (savoir que), procédurale (savoir comment) et conditionnelle (savoir quand et pourquoi). Choisir selon le contexte est conditionnel.",
 "Repère « quand / selon le contexte ». Quand → conditionnelle ; quoi → déclarative ; comment → procédurale. Épisodique et sémantique relèvent d'une autre théorie de la mémoire."]
],
2: [
["Des ouvriers adultes sont sceptiques au début d'un module. Quelle première action est la plus andragogique ?",
 "Expliquer l'utilité professionnelle du contenu avant d'aborder la méthode",
 "Commencer par un test noté pour les situer",
 "Rappeler le règlement disciplinaire",
 "Exposer une longue partie théorique",
 "Lire le référentiel de formation",
 "Le premier principe de Knowles est le besoin de savoir : l'adulte veut comprendre pourquoi il apprend et à quoi cela lui servira.",
 "Cherche l'hypothèse de Knowles qui correspond au scepticisme : besoin de savoir. Les options disciplinaires ou théoriques ne répondent pas au « pourquoi »."],
["Quel outil traduit le mieux le concept de soi autonome de l'adulte en formation ?",
 "Un contrat d'apprentissage négocié (objectifs personnels, ressources, critères)",
 "Un planning imposé par le centre",
 "Un règlement intérieur affiché",
 "Un test de niveau classant",
 "Un cours magistral préparé à l'avance",
 "Le contrat d'apprentissage laisse l'adulte participer au choix de ses objectifs et de ses moyens, ce qui respecte son autonomie.",
 "Autonomie = participer aux décisions. Écarte tout ce qui est imposé par l'institution."],
["Un stagiaire de vingt ans d'expérience conteste la méthode enseignée. Quelle posture est la plus adaptée ?",
 "Reconnaître son expérience comme ressource et l'utiliser pour analyser l'écart avec la méthode attendue",
 "Lui rappeler que c'est le formateur qui détient le savoir",
 "L'ignorer pour ne pas perdre de temps",
 "Lui demander de se taire pendant la séance",
 "Le placer dans un groupe de débutants",
 "L'expérience est une ressource centrale en andragogie. On la confronte aux référentiels par une analyse d'écart, sans opposition frontale.",
 "Une bonne réponse andragogique valorise l'expérience et la met au travail. Repère les mots « ressource », « analyse », « écart »."],
["Dans le cycle de Kolb, après une expérience concrète de montage, quelle étape suit ?",
 "L'observation réflexive",
 "La conceptualisation abstraite",
 "L'expérimentation active",
 "L'évaluation sommative",
 "La mémorisation",
 "Le cycle de Kolb : expérience concrète, observation réflexive, conceptualisation abstraite, expérimentation active. L'étape qui suit l'expérience est l'observation réflexive.",
 "Mémorise l'ordre : concrète, réflexive, abstraite, active. « Évaluation sommative » et « mémorisation » ne font pas partie du cycle."],
["Selon Mezirow, qu'est-ce qui déclenche un apprentissage transformateur chez l'adulte ?",
 "Un dilemme désorientant qui remet en cause ses cadres de référence",
 "Une récompense extrinsèque importante",
 "La répétition d'une tâche connue",
 "Un cours magistral bien structuré",
