function startCards() {
  var all = [];
  THEMES.forEach(function (t) { t.gl.forEach(function (g) { all.push({ g: g, th: t.id }); }); });
  S = { view: "cards", cs: shuffle(all).slice(0, 12), i: 0, show: false, ok: 0, again: [] };
  draw();
}
function viewCards() {
  var n = S.cs.length;
  if (S.i >= n) {
    var rv = S.again.map(function (c) { return '<div class="gl-i"><p><strong>' + c.g[0] + '</strong> <span class="chip">Thème ' + pad(c.th) + '</span></p><p>' + c.g[1] + '</p><p class="ar" dir="rtl" lang="ar"><strong>' + c.g[2] + '</strong> : ' + c.g[3] + '</p><p class="as"><b>Astuce</b> ' + c.g[4] + '</p></div>'; }).join("");
    return '<div class="stack"><p class="eyebrow">Cartes de révision</p><h1 class="score" id="h" tabindex="-1">' + S.ok + '<small> / ' + n + '</small></h1><p>' + (S.again.length ? "Relisez les termes ci-dessous puis refaites un tirage." : "Tous les termes sont acquis. Beau parcours.") + '</p>' +
      '<div class="actions"><button class="btn" data-act="cards">Nouveau tirage</button><button class="btn alt" data-act="gloss">Glossaire</button></div>' +
      (rv ? '<div class="review"><h3 class="eyebrow">À revoir · ' + S.again.length + '</h3>' + rv + '</div>' : '') + '</div>';
  }
  var c = S.cs[S.i], g = c.g;
  var back = S.show
    ? '<div class="fb ok" id="fb" tabindex="-1"><p>' + g[1] + '</p><p class="ar" dir="rtl" lang="ar"><strong>' + g[2] + '</strong> : ' + g[3] + '</p><p class="as"><b>Astuce</b> ' + g[4] + '</p></div>' +
      '<div class="actions"><button class="btn" data-act="cknow">Je savais</button><button class="btn alt" data-act="cagain">À revoir</button></div>'
    : '<button class="btn" data-act="creveal">Voir la réponse</button>';
  return '<div class="stack"><div class="top"><button class="ghost" data-act="gloss">← Glossaire</button><span class="count">' + (S.i + 1) + ' / ' + n + '</span></div>' +
    '<div class="bar" aria-hidden="true"><i style="width:' + Math.round(S.i * 100 / n) + '%"></i></div>' +
    '<p class="eyebrow">Thème ' + pad(c.th) + ' · que signifie ce terme ?</p><h2 class="q" id="h" tabindex="-1">' + g[0] + '</h2><div aria-live="polite" class="stack">' + back + '</div></div>';
}
function cardsAct(act) {
  if (act === "cards") { startCards(); return true; }
  if (S.view !== "cards") return false;
  if (act === "creveal") { S.show = true; draw(true); return true; }
  if (act === "cknow") { S.ok++; S.i++; S.show = false; draw(); return true; }
  if (act === "cagain") { S.again.push(S.cs[S.i]); S.i++; S.show = false; draw(); return true; }
  return false;
}

/* ===== Compte à rebours et thème du jour ===== */
function daysTo(y, m, d) { return Math.ceil((Date.UTC(y, m - 1, d, 8, 0) - Date.now()) / 864e5); }
function jLabel(n) { return n > 0 ? "J-" + n : n === 0 ? "aujourd’hui" : "passé"; }
function todayTheme() {
  var best = null;
  THEMES.forEach(function (t) {
    var p = prog.t[t.id], sc = p ? p.best : -1;
    if (!best || sc < best.sc) best = { t: t, sc: sc };
  });
  return best.t;
}
function countdownHtml() {
  var t = todayTheme();
  return '<p class="stats">Examens : session 2024 le 22 nov. 2026 (' + jLabel(daysTo(2026, 11, 22)) + ') · session 2025 le 27 déc. 2026 (' + jLabel(daysTo(2026, 12, 27)) + ') · dates à confirmer avec la note officielle</p>' +
    '<button class="ghost" data-act="theme" data-id="' + t.id + '">À travailler aujourd’hui : thème ' + pad(t.id) + ' · ' + t.short + ' →</button>';
}

/* ===== Bilingue, astuces de réponse, situations à rédiger ===== */
function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
function casHtml(t) {
  return '<details class="gls"><summary>Situation à rédiger · entraînement</summary><div class="block"><p>' + t.cas.c + '</p>' +

}

/* ===== Simulation d'examen de 120 minutes ===== */
var SIMDUR = 7200;
var QMAP = {};
THEMES.forEach(function (t) { t.q.forEach(function (q) { QMAP[q.k] = { q: q, th: t }; }); });
var timerId = null;
var TIPS = [
  ["Lisez la question avant les choix", "Formulez la réponse dans votre tête, puis cherchez-la. Vous évitez de vous laisser attirer par un distracteur séduisant."],
  ["Repérez les mots pièges", "« toujours », « jamais », « uniquement », « seulement » rendent souvent un choix faux. Dans « n’est PAS » ou « sauf », cherchez l’intrus."],
  ["Éliminez d’abord", "Barrez mentalement les deux choix les plus faibles. Il reste 50 % de chances même si vous hésitez."],
  ["Choisissez la réponse la plus pédagogique", "L’examen valorise l’autonomie, l’explicitation, la cohérence objectif-activité-évaluation, le respect de l’adulte. Les réponses qui punissent, imposent ou isolent sont rarement bonnes."],
  ["Gérez le temps", "48 QCM en environ 55 minutes (1 min 10 par question), 45 minutes pour la situation à rédiger, le reste pour la relecture."],
  ["Marquez et avancez", "Ne bloquez jamais plus de 2 minutes sur une question. Marquez-la, continuez, revenez à la fin."],
  ["Ne changez pas sans raison", "Gardez votre premier choix, sauf si vous repérez une erreur de lecture précise."],
  ["Rédigez avec un plan", "Définition, analyse de la situation, actions concrètes, exemple en réseaux, évaluation. Un plan visible vaut mieux qu’un long texte confus."]
];

function fmtT(s) { s = Math.max(0, Math.round(s)); return pad(Math.floor(s / 60)) + ":" + pad(s % 60); }
function simLeft() { return prog.sim ? SIMDUR - (Date.now() - prog.sim.start) / 1000 : 0; }
function countWords(t) { return (t || "").trim().split(/\s+/).filter(Boolean).length; }
function simNote(r) { return Math.round((r.score / r.n * 14 + (r.ticks.length / 5) * 6) * 2) / 2; }
function fmtNote(x) { return String(x).replace(".", ","); }

function simHomeBtn() {
  if (prog.sim) {
    var l = simLeft();
    if (l <= 0) return '<button class="btn" data-act="sim">Voir le résultat de la simulation</button>';
    return '<button class="btn" data-act="sim">Reprendre la simulation · ' + fmtT(l) + '</button>';
  }
  return '<button class="btn" data-act="sim">Simulation d’examen · 120 min</button>';
}

function simStart() {
  var qs = [];
  THEMES.forEach(function (t) { shuffle(t.q).slice(0, 4).forEach(function (q) { qs.push({ k: q.k, o: shuffle([0, 1, 2, 3]) }); }); });
  prog.sim = { start: Date.now(), qs: shuffle(qs), ans: {}, fl: {}, i: 0, text: "", cas: THEMES[Math.floor(Math.random() * THEMES.length)].id };
  save(); S = { view: "sim" }; draw();
}
function simOpen() {
  if (prog.sim) { if (simLeft() <= 0) simFinish(true); else { S = { view: "sim" }; draw(); } }
  else { S = { view: "simintro" }; draw(); }
}
function simFinish(expired) {
  var sm = prog.sim; if (!sm) return;
  var by = {}, wrong = [], ok = 0, blank = 0;
  prog.w = prog.w || [];
  sm.qs.forEach(function (e, i) {
    var th = QMAP[e.k].th.id; by[th] = by[th] || [0, 0]; by[th][1]++;
    var a = sm.ans[i], pos = prog.w.indexOf(e.k);
    if (a === 0) { ok++; by[th][0]++; if (pos > -1) prog.w.splice(pos, 1); }
    else { if (a === undefined) blank++; wrong.push({ k: e.k, a: a === undefined ? -1 : a }); if (pos === -1) prog.w.push(e.k); }
  });
  var used = Math.min(SIMDUR, Math.round((Date.now() - sm.start) / 1000));
  prog.simLast = { score: ok, n: sm.qs.length, blank: blank, by: by, wrong: wrong, used: used, text: sm.text, cas: sm.cas, ticks: [], expired: !!expired };
  prog.simTries = (prog.simTries || 0) + 1;
  prog.simBest = Math.max(prog.simBest || 0, simNote(prog.simLast));
  prog.sim = null;
  save(); S = { view: "simres" }; draw();
}

function viewSimIntro() {
  var tips = TIPS.map(function (t) { return "<li><strong>" + t[0] + "</strong>" + t[1] + "</li>"; }).join("");
  var th = THEMES.map(function (t) { return "<li><strong>" + pad(t.id) + " · " + t.short + "</strong>" + t.rep + "</li>"; }).join("");
  return '<div class="stack"><div><button class="ghost" data-act="home">← Thématiques</button></div>' +
    '<div class="block"><p class="eyebrow">Simulation · 120 minutes</p><h2 id="h" tabindex="-1">Conditions d’examen</h2></div>' +
    '<p>48 QCM (4 par thème, tirés au hasard) puis 1 situation professionnelle à rédiger. Le chrono ne s’arrête pas si vous quittez la page : vous pouvez reprendre là où vous en étiez. Corrections détaillées et note sur 20 à la fin.</p>' +
    '<div class="piege"><b>À savoir</b>Le document officiel ne précise pas la forme de l’épreuve. Ce format est un entraînement, pas une reproduction du concours. Le barème (14 points QCM, 6 points rédaction) est indicatif.</div>' +
    '<button class="btn" data-act="simstart">Démarrer · 120 min</button>' +
    '<div class="block"><h3>Astuces de réponse</h3><ul class="conf">' + tips + '</ul></div>' +
    '<details class="gls"><summary>Astuce par thème · 12</summary><ul class="conf">' + th + '</ul></details>' +
    '<button class="btn alt" data-act="exam">Plutôt un quiz rapide · 24 questions</button></div>';
}

function viewSim() {
  var sm = prog.sim, n = sm.qs.length, i = sm.i, L = ["A", "B", "C", "D"];
  var answered = Object.keys(sm.ans).length;
  var grid = '<div class="sgrid" role="group" aria-label="Navigation entre les questions">';
  for (var g = 0; g <= n; g++) {
    grid += '<button class="' + (g === i ? "cur " : "") + (g < n && sm.ans[g] !== undefined ? "done " : "") + (sm.fl[g] ? "fl" : "") + '" data-act="sgo" data-id="' + g + '" aria-label="' + (g < n ? "Question " + (g + 1) : "Situation à rédiger") + '"' + (g === i ? ' aria-current="true"' : "") + '>' + (g < n ? g + 1 : "R") + '</button>';
  }
  grid += '</div>';
  var head = '<div class="top simtop"><button class="ghost" data-act="simhome">← Pause</button><span class="count">' + answered + ' / ' + n + ' répondues</span><span class="timer' + (simLeft() < 600 ? " low" : "") + '" id="tm" role="timer">' + fmtT(simLeft()) + '</span></div>';
  var body, nav;
  if (i < n) {
    var e = sm.qs[i], Q = QMAP[e.k];
    var opts = e.o.map(function (oi, p) {
      var sel = sm.ans[i] === oi;
      return '<button class="opt' + (sel ? " sel" : "") + '" data-act="spick" data-i="' + p + '" aria-pressed="' + sel + '"><span class="l">' + L[p] + '</span><span>' + Q.q.o[oi] + '</span></button>';
    }).join("");
    body = '<p class="eyebrow">Question ' + (i + 1) + ' sur ' + n + '</p><h2 class="q" id="h" tabindex="-1">' + Q.q.q + '</h2><div class="opts" role="group" aria-label="Choix de réponse">' + opts + '</div>';
  } else {
    var c = CAS[sm.cas], th = themeById(sm.cas);
    body = '<p class="eyebrow">Situation à rédiger · thème ' + pad(th.id) + '</p><h2 id="h" tabindex="-1">Situation professionnelle</h2><p class="def">' + c.c + '</p>' +
      '<textarea id="wr" rows="12" placeholder="Rédigez votre réponse : définition, analyse, actions, exemple en réseaux, évaluation." aria-label="Votre réponse rédigée">' + esc(sm.text) + '</textarea>' +
      '<p class="stats"><span id="wc">' + countWords(sm.text) + '</span> mots · visez 150 à 250 mots avec un plan en 5 temps</p>';
  }
  nav = '<div class="actions">' + (i > 0 ? '<button class="btn alt" data-act="sprev">Précédente</button>' : '') +
    (i < n ? '<button class="btn alt" data-act="sflag" aria-pressed="' + (sm.fl[i] ? "true" : "false") + '">' + (sm.fl[i] ? "Marquée à revoir" : "Marquer à revoir") + '</button><button class="btn" data-act="snext">Suivante</button>' : '') + '</div>';
  var un = n - answered;
  var end = S.conf
    ? '<div class="fb bad" id="fb" tabindex="-1" role="alert"><b>Rendre la copie ?</b><p>' + (un ? un + ' question' + (un > 1 ? 's' : '') + ' sans réponse. ' : 'Toutes les questions ont une réponse. ') + 'Il reste ' + fmtT(simLeft()) + '. Cette action est définitive.</p><div class="actions"><button class="btn" data-act="syes">Oui, rendre la copie</button><button class="btn alt" data-act="sno">Continuer</button></div></div>'
    : '<button class="ghost" data-act="sdone">Rendre la copie</button>';
  return '<div class="stack">' + head + grid + body + nav + end + '</div>';
}

function viewSimRes() {
  var r = prog.simLast, L = ["A", "B", "C", "D"];
  var note = simNote(r);
  var verdict = note >= 14 ? "Très bon niveau. Entretenez-le avec des simulations régulières." : note >= 10 ? "Au-dessus de la moyenne. Consolidez les thèmes les plus faibles ci-dessous." : "En dessous de 10. Relisez les fiches des thèmes faibles puis refaites une simulation.";
  var ths = Object.keys(r.by).map(function (k) { return { id: parseInt(k, 10), ok: r.by[k][0], n: r.by[k][1] }; });
  ths.sort(function (a, b) { return a.ok / a.n - b.ok / b.n || a.id - b.id; });
  var rows = ths.map(function (t) {
    var th = themeById(t.id), p = Math.round(t.ok * 100 / t.n);
    return '<button class="row" data-act="theme" data-id="' + t.id + '"><span class="n">' + pad(t.id) + '</span><span><strong>' + th.short + '</strong><span class="bar" aria-hidden="true"><i style="width:' + p + '%"></i></span></span><span class="chip ' + (p >= 75 ? "ok" : "") + '">' + t.ok + ' / ' + t.n + '</span></button>';
  }).join("");
  var c = CAS[r.cas], th = themeById(r.cas);
  var ticks = c.p.map(function (p, i) {
    var on = r.ticks.indexOf(i) > -1;
    return '<button class="tk' + (on ? " on" : "") + '" data-act="stick" data-id="' + i + '" aria-pressed="' + on + '"><span class="l">' + (on ? "✓" : "") + '</span><span>' + p + '</span></button>';
  }).join("");
  var rv = r.wrong.map(function (w) {
    var Q = QMAP[w.k], good = Q.q.o[0];
    return '<div class="rv"><p class="eyebrow">Thème ' + pad(Q.th.id) + '</p><strong>' + Q.q.q + '</strong><p>Votre réponse : ' + (w.a < 0 ? "sans réponse" : Q.q.o[w.a]) + '</p><p class="good">Bonne réponse : ' + good + '</p><p>' + Q.q.e + '</p></div>';
  }).join("");
  return '<div class="stack"><p class="eyebrow">Simulation · ' + (r.expired ? "temps écoulé" : "temps utilisé " + fmtT(r.used)) + '</p>' +
    '<h1 class="score" id="h" tabindex="-1">' + fmtNote(note) + '<small> / 20</small></h1><p>' + verdict + '</p>' +
    '<p class="stats">QCM ' + r.score + ' / ' + r.n + ' (' + fmtNote(Math.round(r.score / r.n * 140) / 10) + ' / 14) · sans réponse ' + r.blank + ' · rédaction ' + fmtNote(Math.round(r.ticks.length / 5 * 60) / 10) + ' / 6 (auto-évaluation) · barème indicatif</p>' +
    '<div class="actions"><button class="btn" data-act="simnew">Nouvelle simulation</button>' + ((prog.w || []).length ? '<button class="btn alt" data-act="errors">Revoir mes erreurs · ' + prog.w.length + '</button>' : '') + '<button class="btn alt" data-act="home">Accueil</button></div>' +
    '<div class="block"><h3>Résultat par thème · du plus faible au plus fort</h3><nav class="list">' + rows + '</nav></div>' +
    '<div class="block"><h3>Situation rédigée · thème ' + pad(th.id) + '</h3><p>' + c.c + '</p>' +
    '<details class="gls"><summary>Votre texte · ' + countWords(r.text) + ' mots</summary><p class="mytext">' + (r.text ? esc(r.text) : "Aucun texte rédigé.") + '</p></details>' +
    '<p class="eyebrow">Auto-évaluation : cochez les points présents dans votre texte</p><div class="ticks">' + ticks + '</div></div>' +
    (r.wrong.length ? '<div class="review"><h3 class="eyebrow">À revoir · ' + r.wrong.length + ' question' + (r.wrong.length > 1 ? "s" : "") + '</h3>' + rv + '</div>' : '<p class="eyebrow">Aucune erreur. Beau parcours.</p>') + '</div>';
}

function afterDraw() {
  if (S.view === "sim" && prog.sim) { if (!timerId) timerId = setInterval(simTick, 1000); }
  else if (timerId) { clearInterval(timerId); timerId = null; }
}
function simTick() {
  if (!prog.sim) return;
  var l = simLeft();
  if (l <= 0) { simFinish(true); return; }
  var el = document.getElementById("tm");
  if (el) { el.textContent = fmtT(l); el.className = "timer" + (l < 600 ? " low" : ""); }
}
function simAlive() {
  if (!prog.sim) return false;
  if (simLeft() <= 0) { simFinish(true); return false; }
  return true;
}
function simPick(p) {
  if (!simAlive()) return;
  var sm = prog.sim, e = sm.qs[sm.i]; if (!e) return;
  var oi = e.o[p];
  if (sm.ans[sm.i] === oi) delete sm.ans[sm.i]; else sm.ans[sm.i] = oi;
  save(); draw(true);
  var el = app.querySelector('[data-act="spick"][data-i="' + p + '"]'); if (el) el.focus({ preventScroll: true });
}
function simGo(i) {
  if (!simAlive()) return;
  var n = prog.sim.qs.length;
  prog.sim.i = Math.max(0, Math.min(n, i)); S.conf = false; save(); draw();
}
function simAct(act, b, id) {
  if (act === "sim") { simOpen(); return true; }
  if (act === "simstart") { simStart(); return true; }
  if (act === "simnew") { S = { view: "simintro" }; draw(); return true; }
  if (act === "simhome") { S = { view: "home" }; draw(); return true; }
  if (act === "stick") {
    var r = prog.simLast, pos = r.ticks.indexOf(id);
    if (pos > -1) r.ticks.splice(pos, 1); else r.ticks.push(id);
    prog.simBest = Math.max(prog.simBest || 0, simNote(r)); save(); draw(true);
    var el = app.querySelector('[data-act="stick"][data-id="' + id + '"]'); if (el) el.focus({ preventScroll: true });
    return true;
  }
  if (act === "spick") { simPick(parseInt(b.getAttribute("data-i"), 10)); return true; }
  if (act === "sgo") { simGo(id); return true; }
  if (act === "snext") { simGo(prog.sim.i + 1); return true; }
  if (act === "sprev") { simGo(prog.sim.i - 1); return true; }
  if (act === "sflag") {
    if (!simAlive()) return true;
    var sm = prog.sim; if (sm.fl[sm.i]) delete sm.fl[sm.i]; else sm.fl[sm.i] = 1;
    save(); draw(true); return true;
  }
  if (act === "sdone") { if (simAlive()) { S.conf = true; draw(true); var f = document.getElementById("fb"); if (f) f.focus({ preventScroll: true }); } return true; }
  if (act === "sno") { S.conf = false; draw(true); return true; }
  if (act === "syes") { simFinish(false); return true; }
  return false;
}
document.addEventListener("input", function (e) {
  if (e.target && e.target.id === "wr" && prog.sim) {
    prog.sim.text = e.target.value;
    var wc = document.getElementById("wc"); if (wc) wc.textContent = countWords(e.target.value);
    save();
  }
});
document.addEventListener("keydown", function (e) {
  if (S.view !== "sim" || !prog.sim) return;
  var tag = e.target && e.target.tagName;
  if (tag === "TEXTAREA" || tag === "INPUT") return;
  var k = parseInt(e.key, 10);
  if (k >= 1 && k <= 4 && prog.sim.i < prog.sim.qs.length) simPick(k - 1);
  else if (e.key === "ArrowRight") simGo(prog.sim.i + 1);
  else if (e.key === "ArrowLeft") simGo(prog.sim.i - 1);
});

function tipHtml(t) {
  return '<div class="tip"><b>Astuce de compréhension</b>' + t.tip + '</div>' +
    '<div class="mn"><b>À retenir facilement</b>' + t.mn + '</div>' +
    '<div class="rep"><b>Astuce de réponse au QCM</b>' + t.rep + '</div>';
}
function extrasHtml(t) {
  return '<div class="block"><h3>À ne pas confondre</h3><ul class="conf">' + t.conf.map(function (c) { return "<li><strong>" + c[0] + "</strong>" + c[1] + "</li>"; }).join("") + '</ul></div>' +
    '<div class="piege"><b>Piège d’examen</b>' + t.piege + '</div>' +
    glossHtml(t) + '<details class="gls"><summary>Auteurs et références</summary><ul class="pts">' + t.aut.map(function (a) { return "<li>" + a + "</li>"; }).join("") + '</ul></details>';
}

/* État et stockage léger (sauvegarde facultative) */
var KEY = "qcm-pedagogie-ofppt-v1";
var prog = { t: {}, exam: null };
try { var raw = JSON.parse(localStorage.getItem(KEY)); if (raw && raw.t) prog = raw; } catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(prog)); } catch (e) {} }

var app = document.getElementById("app");
var S = { view: "home" };

function shuffle(a) {
  a = a.slice();
  for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}
function pad(n) { return n < 10 ? "0" + n : "" + n; }
function themeById(id) { return THEMES.filter(function (t) { return t.id === id; })[0]; }

function prepare(q, th) {
  var opts = q.o.map(function (t, i) { return { t: t, ok: i === 0 }; });
  return { q: q.q, e: q.e, k: q.k, opts: shuffle(opts), th: th };
}

function startTheme(id) {
  var th = themeById(id);
  S = { view: "quiz", mode: "theme", themeId: id, qs: shuffle(th.q).map(function (q) { return prepare(q, th); }), i: 0, score: 0, picked: null, wrong: [] };
  draw();
}
function startErrors() {
  var qs = [];
  THEMES.forEach(function (t) { t.q.forEach(function (q) { if ((prog.w || []).indexOf(q.k) > -1) qs.push(prepare(q, t)); }); });
  if (!qs.length) return;
  S = { view: "quiz", mode: "errors", qs: shuffle(qs), i: 0, score: 0, picked: null, wrong: [] };
  draw();
}
function startExam() {
  var pools = THEMES.map(function (t) { return { t: t, qs: shuffle(t.q) }; });
  var chosen = [], round = 0;
  while (chosen.length < 24) {
    var order = shuffle(pools);
    for (var k = 0; k < order.length && chosen.length < 24; k++) {
      var p = order[k];
      if (p.qs[round]) chosen.push(prepare(p.qs[round], p.t));
    }
    round++;
  }
  S = { view: "quiz", mode: "exam", qs: shuffle(chosen), i: 0, score: 0, picked: null, wrong: [] };
  draw();
}

function answer(idx) {
  if (S.picked !== null) return;
  var cur = S.qs[S.i];
  S.picked = idx;
  prog.w = prog.w || [];
  var pos = prog.w.indexOf(cur.k);
  if (cur.opts[idx].ok) { S.score++; if (pos > -1) prog.w.splice(pos, 1); }
  else { S.wrong.push({ q: cur, chosen: cur.opts[idx].t }); if (pos === -1) prog.w.push(cur.k); }
  save();
  draw(true);
}
function next() {
  if (S.picked === null) return;
  S.i++; S.picked = null;
  if (S.i >= S.qs.length) finish(); else draw();
}
function finish() {
  var pct = Math.round(S.score * 100 / S.qs.length);
  if (S.mode === "errors") {
    /* pas de score enregistré pour la révision des erreurs */
  } else if (S.mode === "theme") {
    var old = prog.t[S.themeId] || { best: 0, tries: 0 };
    prog.t[S.themeId] = { best: Math.max(old.best, pct), tries: old.tries + 1 };
  } else {
    var oe = prog.exam || { best: 0, tries: 0 };
    prog.exam = { best: Math.max(oe.best, pct), last: pct, tries: oe.tries + 1 };
  }
  save();
  S.view = "result"; S.pct = pct;
  draw();
}

/* Vues */
function viewHome() {
  var total = THEMES.reduce(function (s, t) { return s + t.q.length; }, 0);
  var nErr = (prog.w || []).length;
  var ids = Object.keys(prog.t);
  var avg = ids.length ? Math.round(ids.reduce(function (s, k) { return s + prog.t[k].best; }, 0) / ids.length) : null;
  var stats = ids.length + " / 12 thèmes travaillés" + (avg !== null ? " · meilleure moyenne " + avg + " %" : "") + (prog.exam ? " · quiz rapide " + prog.exam.best + " %" : "") + (prog.simBest ? " · simulation " + fmtNote(prog.simBest) + " / 20" : "");
  var rows = THEMES.map(function (t) {
    var p = prog.t[t.id];
    return '<button class="row" data-act="theme" data-id="' + t.id + '"><span class="n">' + pad(t.id) + '</span><span><strong>' + t.t + '</strong><small>' + t.short + '</small></span>' + (p ? '<span class="chip ' + (p.best >= 80 ? "ok" : "") + '">' + p.best + ' %</span>' : '<span></span>') + '</button>';
  }).join("");
  return '<div class="stack"><header class="hero"><p class="eyebrow">OFPPT · Promotion interne 2024 &amp; 2025 · Corps formateur</p>' +
    '<h1 id="h" tabindex="-1">Prépa QCM Pédagogie</h1>' +
    '<p class="lead">12 thématiques, ' + total + ' questions. Chaque thème a sa fiche : schéma, définition, astuce, étapes pas à pas, confusions fréquentes, pièges d’examen, astuces de réponse, glossaire bilingue arabe-français et simulation d’examen de 120 minutes. Chaque réponse est expliquée et les choix sont mélangés à chaque tirage.</p>' +
    '<div class="actions">' + simHomeBtn() + '<button class="btn alt" data-act="exam">Quiz rapide · 24 questions</button>' + (nErr ? '<button class="btn alt" data-act="errors">Revoir mes erreurs · ' + nErr + '</button>' : '') + '</div><p class="stats">' + stats + '</p>' + countdownHtml() + '<button class="ghost" data-act="gloss">Glossaire FR / عربي · ' + glossCount() + ' mots-clés et astuces</button><button class="ghost" data-act="videos">Vidéos YouTube · ' + vidCount() + '</button></header>' +
    '<nav class="list" aria-label="Thématiques">' + rows + '</nav></div>';
}

function viewTheme() {
  var t = themeById(S.themeId);
  return '<div class="stack fiche"><div><button class="ghost" data-act="home">← Thématiques</button></div>' +
    '<div class="block"><p class="eyebrow">Thème ' + pad(t.id) + ' sur 12</p><h2 id="h" tabindex="-1">' + t.t + '</h2><p class="ar" dir="rtl" lang="ar">' + t.tAr + '</p></div>' +
    '<div class="block"><h3>Définition</h3><p class="def">' + t.def + '</p></div>' +
    figHtml(t) + tipHtml(t) + stepsHtml(t) +
    '<div class="block"><h3>Points essentiels</h3><ul class="pts">' + t.pts.concat(t.p2).map(function (p) { return "<li>" + p + "</li>"; }).join("") + '</ul></div>' +
    '<div class="block"><h3>Mots-clés</h3><div class="kws">' + t.kw.map(function (k) { return "<span>" + k + "</span>"; }).join("") + '</div></div>' +
    '<div class="reseau"><b>Exemple en réseaux</b>' + t.ex + '</div>' +
    extrasHtml(t) + vidHtml(t) + casHtml(t) +
    '<button class="btn" data-act="start" data-id="' + t.id + '">Lancer le QCM · ' + t.q.length + ' questions</button></div>';
}

function viewQuiz() {
  var cur = S.qs[S.i], n = S.qs.length, done = S.picked !== null;
  var L = ["A", "B", "C", "D"];
  var opts = cur.opts.map(function (o, i) {
    var cls = "opt";
    if (done) { if (o.ok) cls += " ok"; else if (i === S.picked) cls += " bad"; }
    return '<button class="' + cls + '" data-act="pick" data-i="' + i + '"' + (done ? " disabled" : "") + '><span class="l">' + L[i] + '</span><span>' + o.t + '</span></button>';
  }).join("");
  var fb = "";
  if (done) {
    var good = cur.opts[S.picked].ok;
    fb = '<div class="fb ' + (good ? "ok" : "bad") + '" id="fb" tabindex="-1"><b>' + (good ? "Bonne réponse" : "Pas tout à fait") + '</b><p>' + cur.e + '</p></div>' +
      '<button class="btn" data-act="next">' + (S.i + 1 >= n ? "Voir le résultat" : "Question suivante") + '</button>';
  }
  var tag = S.mode !== "theme" ? "Thème " + pad(cur.th.id) + " · " + cur.th.short : "Thème " + pad(cur.th.id);
  return '<div class="stack"><div class="top"><button class="ghost" data-act="quit">← Quitter</button><span class="count">' + (S.i + 1) + ' / ' + n + '</span></div>' +
    '<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="' + n + '" aria-valuenow="' + (S.i + (done ? 1 : 0)) + '"><i style="width:' + Math.round((S.i + (done ? 1 : 0)) * 100 / n) + '%"></i></div>' +
    '<p class="eyebrow">' + tag + '</p><h2 class="q" id="h" tabindex="-1">' + cur.q + '</h2>' +
    '<div class="opts" role="group" aria-label="Choix de réponse">' + opts + '</div><div aria-live="polite" class="stack">' + fb + '</div></div>';
}

function viewResult() {
  var n = S.qs.length;
  var msg = S.pct >= 80 ? "Solide. Vous maîtrisez l'essentiel." : S.pct >= 50 ? "Correct. Les points ci-dessous sont à consolider." : "À retravailler. Relisez la fiche puis recommencez.";
  var rv = S.wrong.map(function (w) {
    var good = w.q.opts.filter(function (o) { return o.ok; })[0].t;
    return '<div class="rv"><p class="eyebrow">Thème ' + pad(w.q.th.id) + '</p><strong>' + w.q.q + '</strong><p>Votre réponse : ' + w.chosen + '</p><p class="good">Bonne réponse : ' + good + '</p><p>' + w.q.e + '</p></div>';
  }).join("");
  var again = S.mode === "theme"
    ? '<button class="btn" data-act="start" data-id="' + S.themeId + '">Refaire ce thème</button><button class="btn alt" data-act="theme" data-id="' + S.themeId + '">Relire la fiche</button>'
    : S.mode === "errors" ? '' : '<button class="btn" data-act="exam">Nouvel examen blanc</button>';
  return '<div class="stack"><p class="eyebrow">' + (S.mode === "exam" ? "Examen blanc" : S.mode === "errors" ? "Révision des erreurs" : "Thème " + pad(S.themeId)) + '</p>' +
    '<h1 class="score" id="h" tabindex="-1">' + S.score + '<small> / ' + n + '</small></h1><p>' + msg + '</p>' +
    '<div class="actions">' + again + '<button class="btn alt" data-act="home">Toutes les thématiques</button></div>' +
    (S.wrong.length ? '<div class="review"><h3 class="eyebrow">À revoir · ' + S.wrong.length + ' question' + (S.wrong.length > 1 ? "s" : "") + '</h3>' + rv + '</div>' : '<p class="eyebrow">Aucune erreur. Beau parcours.</p>') + '</div>';
}

function draw(keepScroll) {
  var html = S.view === "home" ? viewHome() : S.view === "theme" ? viewTheme() : S.view === "gloss" ? viewGloss() : S.view === "videos" ? viewVideos() : S.view === "cards" ? viewCards() : S.view === "simintro" ? viewSimIntro() : S.view === "sim" ? viewSim() : S.view === "simres" ? viewSimRes() : S.view === "quiz" ? viewQuiz() : viewResult();
  app.innerHTML = html;
  afterDraw();
  if (keepScroll) {
    var fb = document.getElementById("fb");
    if (fb) fb.scrollIntoView({ block: "nearest" });
  } else {
    window.scrollTo(0, 0);
    var h = document.getElementById("h");
    if (h) h.focus({ preventScroll: true });
  }
}

app.addEventListener("click", function (e) {
  var b = e.target.closest("[data-act]");
  if (!b) return;
  var act = b.getAttribute("data-act"), id = parseInt(b.getAttribute("data-id"), 10);
  if (act === "home" || act === "quit") { S = { view: "home" }; draw(); }
  else if (act === "theme") { S = { view: "theme", themeId: id }; draw(); }
  else if (act === "start") startTheme(id);
  else if (act === "exam") startExam();
  else if (act === "errors") startErrors();
  else if (act === "gloss") { S = { view: "gloss" }; draw(); }
  else if (videoAct(act, b)) { }
  else if (cardsAct(act)) { }
  else if (simAct(act, b, id)) { }
  else if (act === "pick") answer(parseInt(b.getAttribute("data-i"), 10));
  else if (act === "next") next();
});
document.addEventListener("keydown", function (e) {
  if (S.view !== "quiz" || S.picked !== null) return;
  var k = parseInt(e.key, 10);
  if (k >= 1 && k <= 4) answer(k - 1);
});

draw();
</script>

</body>
</html>
