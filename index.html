<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Prépa QCM Pédagogie OFPPT : 312 QCM, glossaire bilingue de 168 mots-clés, simulation de 120 minutes, 42 vidéos YouTube.">
<title>QCM Pédagogie OFPPT</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=JetBrains+Mono:wght@500&family=Source+Sans+3:wght@400;600;700&family=Noto+Naskh+Arabic:wght@400;700&display=swap">
<style>
/* Layout: une colonne de lecture étroite, liste de thèmes en lignes, quiz une question par écran */
:root {
  --bg: #F1F4F3;
  --surface: #FFFFFF;
  --ink: #13222B;
  --muted: #55656C;
  --line: #D3DBD9;
  --accent: #1D5BA6;
  --accent-ink: #FFFFFF;
  --accent-soft: #DDE9F7;
  --ok: #17724B;
  --ok-soft: #DDF1E6;
  --bad: #B03626;
  --bad-soft: #F8E0DB;
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  --f-ar: "Noto Naskh Arabic", "Segoe UI", Tahoma, system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1A20; --surface: #16252D; --ink: #E7EEEC; --muted: #98A9AF; --line: #2A3C45;
    --accent: #6FA8E8; --accent-ink: #0F1A20; --accent-soft: #1B3347;
    --ok: #5FCB98; --ok-soft: #15372A; --bad: #F08A7B; --bad-soft: #3E1F1B;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1A20; --surface: #16252D; --ink: #E7EEEC; --muted: #98A9AF; --line: #2A3C45;
  --accent: #6FA8E8; --accent-ink: #0F1A20; --accent-soft: #1B3347;
  --ok: #5FCB98; --ok-soft: #15372A; --bad: #F08A7B; --bad-soft: #3E1F1B;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font: 17px/1.55 var(--f-body);
  padding-block: 20px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
#app { max-width: 680px; margin: 0 auto; }
h1, h2, h3 { font-family: var(--f-display); line-height: 1.12; margin: 0; text-wrap: balance; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.eyebrow { font: 500 12px/1.4 var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.stack { display: flex; flex-direction: column; gap: 20px; }
.btn {
  background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 10px;
  min-height: 50px; padding: 12px 20px; font-weight: 700; text-align: center;
}
.btn.alt { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }
.ghost { background: none; border: 0; padding: 8px 0; min-height: 44px; color: var(--accent); font-weight: 600; }
.chip { font: 500 12px/1 var(--f-mono); padding: 5px 8px; border-radius: 6px; background: var(--accent-soft); color: var(--ink); white-space: nowrap; }
.chip.ok { background: var(--ok-soft); }

/* Accueil */
.hero { display: flex; flex-direction: column; gap: 14px; padding-top: 8px; }
.hero h1 { font-size: clamp(2rem, 8vw, 2.9rem); }
.hero p.lead { color: var(--muted); max-width: 52ch; }
.hero .btn { align-self: flex-start; }
.stats { font: 500 13px/1.4 var(--f-mono); color: var(--muted); }
.list { display: flex; flex-direction: column; border-top: 1.5px solid var(--line); }
.row {
  display: grid; grid-template-columns: 2.2rem minmax(0, 1fr) auto; align-items: center; gap: 12px;
  text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line);
  padding: 14px 2px; min-height: 64px;
}
.row .n { font: 500 13px var(--f-mono); color: var(--muted); }
.row strong { display: block; font-family: var(--f-display); font-weight: 600; font-size: 1.04rem; line-height: 1.25; }
.row small { display: block; color: var(--muted); font-size: .9rem; line-height: 1.35; margin-top: 2px; }
.row:hover strong { color: var(--accent); }

/* Fiche */
.fiche h2 { font-size: clamp(1.6rem, 6vw, 2.1rem); }
.block { display: flex; flex-direction: column; gap: 8px; }
.block h3 { font: 500 12px/1.4 var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.def { font-size: 1.1rem; }
.pts { margin: 0; padding-left: 1.2rem; display: flex; flex-direction: column; gap: 8px; }
.kws { display: flex; flex-wrap: wrap; gap: 8px; }
.kws span { border: 1.5px solid var(--line); border-radius: 999px; padding: 3px 12px; font-size: .92rem; }
.reseau { background: var(--accent-soft); border-radius: 8px; padding: 14px 16px; }
.reseau b { font: 500 12px var(--f-mono); letter-spacing: .06em; text-transform: uppercase; display: block; margin-bottom: 4px; }

/* Quiz */
.top { display: flex; justify-content: space-between; align-items: center; }
.count { font: 500 14px var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); transition: width .25s; }
.q { font-size: clamp(1.3rem, 5vw, 1.65rem); }
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt {
  display: grid; grid-template-columns: 1.8rem minmax(0, 1fr); gap: 10px; align-items: start; text-align: left;
  background: var(--surface); border: 1.5px solid var(--line); border-radius: 10px; padding: 13px 14px; min-height: 52px;
}
.opt .l { font: 500 14px/1.6 var(--f-mono); color: var(--muted); }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:disabled { cursor: default; }
.opt.ok { border-color: var(--ok); background: var(--ok-soft); }
.opt.bad { border-color: var(--bad); background: var(--bad-soft); }
.fb { border-radius: 10px; padding: 14px 16px; background: var(--surface); border: 1.5px solid var(--line); display: flex; flex-direction: column; gap: 6px; }
.fb.ok { border-color: var(--ok); }
.fb.bad { border-color: var(--bad); }
.fb b { font-family: var(--f-display); font-size: 1.05rem; }
.fb.ok b { color: var(--ok); }
.fb.bad b { color: var(--bad); }

/* Résultats */
.score { font: 700 clamp(3rem, 14vw, 4.5rem)/1 var(--f-display); font-variant-numeric: tabular-nums; }
.score small { font-size: .4em; color: var(--muted); font-weight: 600; }
.review { display: flex; flex-direction: column; gap: 14px; }
.rv { border-top: 1.5px solid var(--line); padding-top: 14px; display: flex; flex-direction: column; gap: 6px; }
.rv .good { color: var(--ok); font-weight: 600; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; }
.tip, .mn, .piege { border-radius: 8px; padding: 14px 16px; }
.tip { background: var(--accent-soft); }
.mn { border: 1.5px dashed var(--accent); }
.piege { background: var(--bad-soft); }
.tip b, .mn b, .piege b { font: 500 12px var(--f-mono); letter-spacing: .06em; text-transform: uppercase; display: block; margin-bottom: 4px; }
.conf { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.conf li { border-left: 3px solid var(--line); padding-left: 12px; }
.conf strong { display: block; font-family: var(--f-display); font-weight: 600; }
.hero .ghost { align-self: flex-start; }
.fig { margin: 0; background: var(--surface); border: 1.5px solid var(--line); border-radius: 10px; padding: 12px; }
.fig figcaption { font: 500 12px/1.4 var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
.sv { display: block; width: 100%; height: auto; }
.sv text { fill: var(--ink); font-family: var(--f-body); font-size: 16px; }
.sv .sm { font-size: 14.5px; fill: var(--muted); }
.sv .b { font-weight: 700; font-family: var(--f-display); }
.sv .bs { font-weight: 700; font-family: var(--f-display); font-size: 15px; }
.sv .bx { fill: var(--surface); stroke: var(--line); stroke-width: 1.5; }
.sv .acc { fill: var(--accent-soft); stroke: var(--accent); }
.sv .ok { fill: var(--ok-soft); stroke: var(--ok); }
.sv .bad { fill: var(--bad-soft); stroke: var(--bad); }
.sv line { stroke: var(--accent); stroke-width: 2.5; stroke-linecap: round; }
.sv .dash { stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 5 4; }
.sv .hd { fill: var(--accent); }
.sv .da { fill: var(--accent); }
.sv .db { fill: var(--bad); }
.sv .do { fill: var(--ok); }
details.gls summary { font: 500 12px/1.4 var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); cursor: pointer; min-height: 44px; display: flex; align-items: center; }
details.gls dl { margin: 4px 0 0; display: flex; flex-direction: column; }
.gl-i { border-bottom: 1px solid var(--line); padding: 10px 2px; display: flex; flex-direction: column; gap: 2px; }
.gl-i p, .gl-i dd { margin: 0; }
.gl-i dt { font-weight: 700; }
input[type="search"] { font: inherit; color: var(--ink); background: var(--surface); border: 1.5px solid var(--line); border-radius: 10px; min-height: 50px; padding: 10px 14px; width: 100%; }

/* Bilingue et simulation */
.ar { font-family: var(--f-ar); direction: rtl; text-align: right; font-size: 1.12em; line-height: 1.8; color: var(--ink); }
.fiche h2 + .ar { color: var(--muted); margin-top: 4px; }
.gl-i .ar { border-top: 1px dashed var(--line); padding-top: 4px; margin-top: 2px; }
.rep { border-radius: 8px; padding: 14px 16px; background: var(--ok-soft); }
.rep b { font: 500 12px var(--f-mono); letter-spacing: .06em; text-transform: uppercase; display: block; margin-bottom: 4px; }
.simtop { position: sticky; top: 0; z-index: 2; background: var(--bg); padding: 6px 0; gap: 8px; }
.timer { font: 700 18px var(--f-mono); font-variant-numeric: tabular-nums; }
.timer.low { color: var(--bad); }
.sgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(40px, 1fr)); gap: 6px; }
.sgrid button { min-height: 40px; border: 1.5px solid var(--line); border-radius: 8px; background: var(--surface); font: 500 13px var(--f-mono); }
.sgrid .done { background: var(--accent-soft); }
.sgrid .cur { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
.sgrid .fl { border-color: var(--bad); border-style: dashed; }
.opt.sel { border-color: var(--accent); background: var(--accent-soft); }
textarea { font: inherit; color: var(--ink); background: var(--surface); border: 1.5px solid var(--line); border-radius: 10px; padding: 12px 14px; width: 100%; resize: vertical; min-height: 220px; }
.ticks { display: flex; flex-direction: column; gap: 8px; }
.tk { display: grid; grid-template-columns: 1.8rem minmax(0, 1fr); gap: 10px; text-align: left; background: var(--surface); border: 1.5px solid var(--line); border-radius: 10px; padding: 11px 14px; }
.tk.on { border-color: var(--ok); background: var(--ok-soft); }
.tk .l { font-weight: 700; color: var(--ok); }
.mytext { white-space: pre-wrap; background: var(--surface); border: 1.5px solid var(--line); border-radius: 8px; padding: 12px; }
.row .bar { margin-top: 6px; }
.vlist { display: flex; flex-direction: column; gap: 18px; }
.vid { border-top: 1.5px solid var(--line); padding-top: 14px; display: flex; flex-direction: column; gap: 6px; }
.vp iframe { width: 100%; aspect-ratio: 16 / 9; border: 0; border-radius: 10px; background: #000; }
.vp:empty { display: none; }
.vm { color: var(--muted); font-size: .92rem; }
.lnk { display: inline-flex; align-items: center; min-height: 50px; font-weight: 600; color: var(--accent); }
.as { background: var(--accent-soft); border-radius: 6px; padding: 6px 10px; margin-top: 4px !important; font-size: .95rem; }
.as b { font: 500 11px var(--f-mono); letter-spacing: .06em; text-transform: uppercase; margin-right: 6px; }
select { font: inherit; color: var(--ink); background: var(--surface); border: 1.5px solid var(--line); border-radius: 10px; min-height: 50px; padding: 10px 14px; width: 100%; }
@media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }
</style>

</head>
<body>
<main id="app"></main>

<script>
/* Banque de questions. Dans chaque question, la 1re option est la bonne : l'ordre est mélangé à chaque tirage. */
var THEMES = [
{ id: 1, t: "Ingénierie de la métacognition appliquée au geste professionnel", short: "Penser sa façon d'apprendre et d'agir",
  def: "La métacognition est la capacité à penser sa propre façon d'apprendre et d'agir : savoir ce que l'on sait, planifier sa démarche, la contrôler pendant l'action, puis l'évaluer. Appliquée au geste professionnel, elle consiste à rendre conscient et explicite ce que l'on fait quand on exécute un geste technique.",
  pts: ["Notion introduite par John Flavell dans les années 1970.", "Deux volets : les connaissances métacognitives (sur soi, la tâche, les stratégies) et la régulation (planifier, contrôler, évaluer).", "Outils : verbalisation du geste, pensée à voix haute, journal de bord, grille d'auto-évaluation.", "Objectif : plus d'autonomie et un meilleur transfert vers des situations nouvelles."],
  kw: ["Flavell", "Planification", "Contrôle", "Régulation", "Auto-évaluation", "Verbalisation"],
  ex: "Après avoir serti un câble RJ45, le stagiaire explique à voix haute l'ordre des fils (T568B), le teste, puis note ce qu'il changerait la prochaine fois.",
  q: [
    { q: "Quel chercheur est associé à l'introduction du concept de métacognition ?", o: ["John Flavell", "Malcolm Knowles", "John Sweller", "David Kolb"], e: "Flavell a introduit le concept dans les années 1970. Knowles est lié à l'andragogie, Sweller à la charge cognitive, Kolb à l'apprentissage par l'expérience." },
    { q: "En cours de tâche, un stagiaire s'arrête pour vérifier que son câblage suit bien le schéma prévu. De quelle composante de la régulation s'agit-il ?", o: ["Le contrôle", "La planification", "Le transfert", "La différenciation"], e: "Vérifier en cours d'action que l'on est sur la bonne voie, c'est le contrôle. La planification se fait avant l'action, l'évaluation après." },
    { q: "Quelle pratique favorise le plus la métacognition sur un geste technique ?", o: ["Faire verbaliser ce qu'il fait, au fur et à mesure", "Montrer le geste une seule fois sans commentaire", "Donner la solution complète tout de suite", "Chronométrer sans aucun retour"], e: "Verbaliser rend la démarche visible : le stagiaire repère ses propres stratégies et ses erreurs, et le formateur peut les travailler." },
    { q: "Les connaissances métacognitives portent sur :", o: ["La personne, la tâche et les stratégies", "Uniquement les contenus théoriques", "Les résultats des examens", "Le matériel de l'atelier"], e: "On distingue la connaissance de soi comme apprenant, celle de la tâche (exigences, difficulté) et celle des stratégies utiles." },
    { q: "Un stagiaire dit : « Je confonds switch et routeur, je vais me faire un tableau comparatif. » Il fait preuve de :", o: ["Connaissance de lui-même et choix d'une stratégie", "Surcharge cognitive", "Transfert lointain", "Neutralité éthique"], e: "Il identifie sa difficulté (connaissance de soi) et choisit un moyen d'y remédier (stratégie) : c'est de la métacognition." },
    { q: "Quel est l'intérêt principal de la métacognition en formation professionnelle ?", o: ["Rendre le stagiaire autonome et capable de transférer ses acquis", "Raccourcir la formation à zéro heure", "Remplacer toute évaluation", "Supprimer le besoin de pratiquer"], e: "En comprenant comment il apprend, le stagiaire devient autonome et réutilise plus facilement ses acquis dans de nouvelles situations." }
  ] },
{ id: 2, t: "Andragogie et posture du formateur face à un public d'adultes", short: "Accompagner des adultes plutôt que transmettre",
  def: "L'andragogie est l'art d'accompagner l'apprentissage des adultes. Elle s'appuie sur le fait qu'un adulte est autonome, possède une expérience riche, apprend pour résoudre des problèmes concrets et a besoin de comprendre l'utilité de ce qu'il apprend.",
  pts: ["Malcolm Knowles a popularisé le terme, par opposition à la pédagogie (enfants).", "Principes : besoin de savoir pourquoi, autonomie, expérience comme ressource, apprentissage lié à des problèmes réels, motivation interne.", "Posture du formateur : facilitateur et accompagnateur plus que détenteur du savoir.", "Pratiques : contrat pédagogique, objectifs partagés, partir de l'expérience des stagiaires, études de cas."],
  kw: ["Knowles", "Autonomie", "Expérience", "Facilitateur", "Contrat pédagogique"],
  ex: "Avant d'expliquer les VLAN, le formateur demande aux stagiaires déjà en entreprise de décrire un problème de réseau lent, puis part de ces cas.",
  q: [
    { q: "Qui a popularisé l'andragogie ?", o: ["Malcolm Knowles", "Jean Piaget", "Benjamin Bloom", "B. F. Skinner"], e: "Malcolm Knowles a diffusé l'andragogie comme théorie de l'éducation des adultes." },
    { q: "Selon l'andragogie, l'expérience de l'adulte est :", o: ["Une ressource à exploiter dans la formation", "Un obstacle qu'il faut effacer", "Un élément secondaire sans effet", "Une source de conflits à éviter"], e: "L'adulte arrive avec un vécu professionnel : le formateur s'appuie dessus pour ancrer les nouveaux apprentissages." },
    { q: "Quelle posture correspond le mieux à l'andragogie ?", o: ["Facilitateur qui accompagne", "Détenteur du savoir qui dicte", "Surveillant qui contrôle", "Juge qui sanctionne"], e: "Le formateur d'adultes guide, questionne et met en situation, plutôt que de seulement transmettre." },
    { q: "Un adulte est surtout motivé à apprendre quand :", o: ["Le contenu répond à un problème concret de son travail", "Il y est obligé sans explication", "Seule la note finale compte", "Le contenu est abstrait et sans lien"], e: "L'adulte est orienté vers la résolution de problèmes : plus le lien avec sa pratique est clair, plus il s'engage." },
    { q: "Au début d'un module, quelle action respecte le besoin de savoir pourquoi ?", o: ["Présenter les objectifs et l'utilité professionnelle du module", "Commencer par un long cours magistral", "Garder le programme secret", "Annoncer seulement la date de l'examen"], e: "Expliquer à quoi sert le module dans le métier répond au premier principe de Knowles : le besoin de savoir." },
    { q: "Le contrat pédagogique sert à :", o: ["Clarifier attentes, règles et objectifs entre formateur et stagiaires", "Remplacer l'évaluation", "Sanctionner les retards", "Fixer la rémunération du formateur"], e: "C'est un accord explicite sur ce que chacun attend et s'engage à faire. Il soutient l'autonomie et la responsabilité de l'adulte." }
  ] },
{ id: 3, t: "Alignement pédagogique orienté compétences (APC)", short: "Objectifs, activités et évaluation en cohérence",
  def: "L'alignement pédagogique (Biggs) consiste à faire concorder trois éléments : les objectifs ou compétences visés, les activités d'apprentissage et l'évaluation. Dans l'approche par compétences (APC), on forme et on évalue la capacité à mobiliser des ressources (savoirs, savoir-faire, savoir-être) dans une situation professionnelle réelle.",
  pts: ["John Biggs : alignement constructif entre résultats attendus, activités et évaluation.", "Une compétence est un savoir-agir en situation, pas une simple liste de connaissances.", "Les objectifs s'écrivent avec des verbes d'action observables.", "Conception à rebours : partir de la compétence visée, définir comment la prouver, puis choisir les activités."],
  kw: ["Biggs", "Alignement constructif", "Compétence", "Critères de performance", "Conception à rebours"],
  ex: "Compétence visée : configurer un VLAN. L'évaluation est une mise en situation sur switch, pas seulement un QCM de définitions.",
  q: [
    { q: "L'alignement pédagogique met en cohérence :", o: ["Objectifs, activités d'apprentissage et évaluation", "Horaires, salles et matériel", "Notes, moyennes et classement", "Formateur, directeur et inspecteur"], e: "C'est le principe central de Biggs : ce que l'on vise, ce que l'on fait faire et ce que l'on évalue doivent concorder." },
    { q: "Une compétence se définit comme :", o: ["La capacité à mobiliser des ressources pour agir efficacement en situation", "Une liste de chapitres du cours", "Un diplôme obtenu", "La mémorisation d'un maximum de définitions"], e: "La compétence est un savoir-agir : on mobilise savoirs, savoir-faire et savoir-être face à une situation précise." },
    { q: "Objectif : « configurer un VLAN ». Évaluation : un QCM de définitions. Quel est le problème ?", o: ["Désalignement : l'évaluation ne mesure pas le geste visé", "Aucun problème", "L'objectif est trop facile", "Le QCM est interdit"], e: "Pour évaluer une configuration, il faut observer la configuration : une mise en situation sur équipement est alignée avec l'objectif." },
    { q: "Quel verbe d'objectif est le plus observable ?", o: ["Configurer", "Comprendre", "Savoir", "Apprécier"], e: "Configurer se voit et se vérifie. Comprendre, savoir ou apprécier décrivent un état interne difficile à observer directement." },
    { q: "Dans la conception à rebours, on commence par :", o: ["Définir la compétence visée et les preuves de maîtrise", "Choisir les diapositives", "Planifier les pauses", "Commander le matériel"], e: "On part de la fin : que doit savoir faire le stagiaire, comment le prouvera-t-il, et seulement ensuite on bâtit les activités." },
    { q: "Les critères de performance servent à :", o: ["Décrire précisément ce qui permet de juger la réussite d'une tâche", "Classer les stagiaires entre eux", "Punir les erreurs", "Décorer le référentiel"], e: "Ils rendent l'évaluation objective et communicable : le stagiaire sait à l'avance ce qu'on attend de lui." }
  ] },
{ id: 4, t: "Gestion de la charge cognitive en contexte technique/gestuel", short: "Ne pas saturer la mémoire de travail",
  def: "La théorie de la charge cognitive (Sweller) part du principe que la mémoire de travail est limitée. Un bon enseignement réduit les efforts inutiles pour laisser la capacité mentale à la compréhension, surtout quand on apprend un geste ou un contenu technique nouveau.",
  pts: ["Trois charges : intrinsèque (complexité du contenu), extrinsèque ou parasite (mauvaise présentation), pertinente (construction de schémas).", "Réduire l'extrinsèque : supports clairs, un message par diapositive, pas de texte lu mot à mot.", "Découper en étapes, utiliser des exemples résolus, puis réduire progressivement le guidage.", "Tenir compte des prérequis : le novice est vite saturé."],
  kw: ["Sweller", "Mémoire de travail", "Charge intrinsèque", "Charge parasite", "Exemples résolus", "Segmentation"],
  ex: "Au lieu d'expliquer d'un coup adressage, masque, passerelle et DNS, le formateur enchaîne quatre mini-étapes, avec un exemple résolu à chaque fois.",
  q: [
    { q: "Qui est à l'origine de la théorie de la charge cognitive ?", o: ["John Sweller", "John Flavell", "Donald Schön", "John Biggs"], e: "Sweller a formulé cette théorie à la fin des années 1980, à partir des limites de la mémoire de travail." },
    { q: "Une diapositive surchargée de texte, lue à voix haute par le formateur, génère surtout une charge :", o: ["Extrinsèque (parasite)", "Intrinsèque", "Pertinente", "Aucune charge"], e: "La mauvaise présentation de l'information crée une charge inutile, dite extrinsèque. On peut et on doit la réduire." },
    { q: "La charge intrinsèque dépend principalement :", o: ["De la complexité du contenu et du niveau du stagiaire", "De la couleur du support", "Du bruit dans la salle", "Du nombre de stagiaires"], e: "Un contenu avec beaucoup d'éléments qui interagissent est plus lourd, surtout pour un débutant sans schémas en mémoire." },
    { q: "Quelle stratégie réduit la charge pour un débutant face à un geste complexe ?", o: ["Découper en étapes et montrer des exemples résolus", "Tout expliquer en une seule fois", "Lui donner un problème ouvert sans aide", "Supprimer les démonstrations"], e: "Segmenter et fournir des exemples résolus permet au novice de construire des schémas sans être submergé." },
    { q: "La charge pertinente (germane) est celle qui :", o: ["Aide à construire des schémas et à comprendre", "Distrait l'apprenant", "N'a aucun effet", "Provoque la fatigue"], e: "C'est l'effort utile : celui qui sert à organiser les connaissances en mémoire à long terme. On cherche à le favoriser." },
    { q: "La mémoire de travail est :", o: ["Limitée en capacité et en durée", "Illimitée", "Réservée aux experts", "Identique à la mémoire à long terme"], e: "On ne peut traiter que quelques éléments à la fois. D'où l'intérêt de dosage, de découpage et de supports épurés." }
  ] },
{ id: 5, t: "Techniques de questionnement pour l'analyse de pratique professionnelle", short: "Poser des questions qui font décrire et analyser",
  def: "Le questionnement est l'ensemble des questions que pose le formateur pour amener le stagiaire à décrire, analyser et améliorer sa pratique professionnelle. Une bonne question aide à comprendre ce qui a été fait, comment et avec quels effets, sans juger ni donner la réponse.",
  pts: ["Questions ouvertes (comment, que, qu'est-ce qui) plutôt que fermées (oui/non) pour faire décrire.", "Entretien d'explicitation (Vermersch) : faire décrire le déroulement de l'action, éviter le « pourquoi » qui pousse à se justifier.", "Schön : réflexion dans l'action et réflexion sur l'action.", "Techniques : reformulation, relance, silence, clarification, maïeutique socratique."],
  kw: ["Vermersch", "Question ouverte", "Explicitation", "Reformulation", "Relance", "Maïeutique"],
  ex: "« Comment as-tu procédé pour trouver la panne ? Qu'as-tu testé en premier ? » plutôt que « Pourquoi n'as-tu pas testé le câble ? ».",
  q: [
    { q: "Quelle question aide le plus à faire décrire une démarche ?", o: ["« Comment t'y es-tu pris pour diagnostiquer la panne ? »", "« Tu as vérifié le câble ? »", "« C'est bon, non ? »", "« Pourquoi as-tu encore échoué ? »"], e: "Une question ouverte centrée sur l'action (comment, qu'as-tu fait) fait décrire sans juger. Les autres sont fermées ou accusatrices." },
    { q: "Dans l'entretien d'explicitation, pourquoi évite-t-on souvent « pourquoi » ?", o: ["Il pousse à se justifier plutôt qu'à décrire l'action", "Il est interdit par le règlement", "Il est trop poli", "Il rallonge l'entretien"], e: "Vermersch recommande de faire décrire le déroulé de l'action. Le « pourquoi » amène des justifications et des opinions." },
    { q: "Une question fermée appelle surtout :", o: ["Une réponse courte, oui ou non", "Un récit détaillé", "Une réflexion longue", "Un débat de groupe"], e: "Les questions fermées servent à vérifier un point précis, mais elles ne font pas décrire une pratique." },
    { q: "Reformuler la réponse du stagiaire permet de :", o: ["Vérifier la compréhension et l'aider à préciser sa pensée", "Lui montrer qu'il a tort", "Gagner du temps", "Clore l'échange"], e: "La reformulation montre à la personne qu'on l'écoute et l'invite à clarifier ou à compléter." },
    { q: "Schön distingue :", o: ["La réflexion dans l'action et la réflexion sur l'action", "La théorie et la pratique", "Le savoir et le savoir-être", "L'évaluation formative et sommative"], e: "Réfléchir dans l'action, c'est ajuster pendant que l'on agit. Réfléchir sur l'action, c'est analyser après coup." },
    { q: "La maïeutique consiste à :", o: ["Amener l'autre à trouver lui-même la réponse par des questions successives", "Donner directement la réponse", "Noter les erreurs", "Interdire les questions"], e: "Héritée de Socrate, la maïeutique « accouche » les idées de l'interlocuteur grâce à un questionnement progressif." }
  ] },
{ id: 6, t: "Transfert des apprentissages vers le poste de travail", short: "Réutiliser en entreprise ce qui a été appris",
  def: "Le transfert des apprentissages est la capacité à réutiliser ce qui a été appris en formation dans une autre situation, en particulier au poste de travail. Il ne se produit pas automatiquement : il se prépare avant, pendant et après la formation.",
  pts: ["Transfert proche (situation très semblable) et transfert lointain (situation différente).", "Baldwin et Ford : trois facteurs, les caractéristiques de l'apprenant, la conception de la formation et l'environnement de travail.", "Kirkpatrick : le niveau 3 mesure le changement de comportement au travail.", "Leviers : situations authentiques, cas variés, plans d'action, suivi après la formation, soutien du responsable."],
  kw: ["Transfert proche", "Transfert lointain", "Baldwin et Ford", "Kirkpatrick", "Situations authentiques"],
  ex: "Après un TP sur un switch d'une marque, proposer un cas sur le matériel d'une autre marque pour travailler le transfert lointain.",
  q: [
    { q: "Réutiliser une procédure dans une situation presque identique à celle de la formation est un transfert :", o: ["Proche", "Lointain", "Nul", "Inversé"], e: "Plus la situation ressemble à l'apprentissage, plus le transfert est proche. Il est lointain quand le contexte change nettement." },
    { q: "Dans le modèle de Kirkpatrick, quel niveau évalue le changement de comportement au travail ?", o: ["Niveau 3", "Niveau 1", "Niveau 2", "Niveau 4"], e: "Niveau 1 : réaction. Niveau 2 : apprentissage. Niveau 3 : comportement. Niveau 4 : résultats pour l'organisation." },
    { q: "Baldwin et Ford identifient comme facteurs du transfert :", o: ["Caractéristiques de l'apprenant, conception de la formation, environnement de travail", "Salle, horaire, tarif", "Âge, genre, ville", "Diplôme, note, rang"], e: "Le transfert dépend de la personne, de la manière dont la formation est conçue, et de ce que permet l'environnement de travail." },
    { q: "Quelle action favorise le plus le transfert ?", o: ["Travailler sur des situations variées et proches du poste réel", "Faire apprendre par cœur", "Éviter les exercices pratiques", "Utiliser un seul exemple répété"], e: "La variété des cas et le réalisme des situations préparent les stagiaires à réutiliser leurs acquis dans des contextes différents." },
    { q: "Un transfert lointain consiste à :", o: ["Utiliser ses acquis dans un contexte assez différent de celui de la formation", "Répéter exactement le même exercice", "Oublier ce qu'on a appris", "Rendre un devoir noté"], e: "C'est le plus difficile : le stagiaire doit reconnaître les principes communs derrière des situations qui semblent différentes." },
    { q: "Quel obstacle au transfert vient de l'environnement de travail ?", o: ["Un responsable qui ne laisse pas appliquer les nouvelles méthodes", "Un stagiaire très motivé", "Un support de cours clair", "Une bonne note à l'examen"], e: "Même bien formé, un salarié ne transfère pas si l'environnement bloque l'application des nouveaux acquis." }
  ] },
{ id: 7, t: "Différenciation pédagogique face à l'hétérogénéité des parcours", short: "Même objectif, chemins variés",
  def: "La différenciation pédagogique consiste à adapter les moyens (contenus, démarches, rythmes, supports, productions) pour permettre à des stagiaires aux parcours différents d'atteindre les mêmes objectifs. On change le chemin, pas la destination.",
  pts: ["Part d'un diagnostic des acquis et des besoins (évaluation diagnostique).", "Leviers (Tomlinson) : contenus, processus, productions, environnement.", "Outils : groupes de besoin, tutorat entre pairs, exercices à niveaux, consignes modulables, rythme variable.", "Différencier n'est pas baisser les exigences : les objectifs restent communs."],
  kw: ["Tomlinson", "Meirieu", "Évaluation diagnostique", "Tutorat", "Groupes de besoin"],
  ex: "Dans un groupe qui mêle bacheliers et stagiaires ayant déjà configuré des réseaux, proposer trois niveaux d'exercices sur le routage statique avec le même objectif final.",
  q: [
    { q: "Différencier, c'est surtout :", o: ["Varier les moyens pour atteindre les mêmes objectifs", "Baisser le niveau pour tous", "Donner systématiquement des objectifs différents à chacun", "Exclure les stagiaires en difficulté"], e: "Les objectifs restent communs. Ce qui varie, ce sont les voies pour y parvenir : supports, rythme, aides, productions." },
    { q: "Quel outil permet de repérer les écarts de départ entre stagiaires ?", o: ["L'évaluation diagnostique", "Le certificat de fin de formation", "L'examen sommatif", "Le règlement intérieur"], e: "L'évaluation diagnostique, faite en début de module, éclaire les acquis et les besoins pour adapter l'enseignement." },
    { q: "Le tutorat entre pairs consiste à :", o: ["Faire aider un stagiaire par un autre plus avancé", "Laisser le formateur tout faire seul", "Faire noter les stagiaires entre eux", "Supprimer le travail en groupe"], e: "Expliquer à un pair consolide les acquis du tuteur et apporte une aide proche du langage du stagiaire aidé." },
    { q: "Quel exemple relève de la différenciation des productions ?", o: ["Permettre de prouver la même compétence par un schéma, un compte rendu ou une démonstration", "Imposer le même devoir sans aucun choix", "Supprimer le TP", "Donner une note unique pour tous"], e: "Différencier les productions, c'est offrir plusieurs formes pour montrer l'atteinte d'un même objectif." },
    { q: "Une différenciation réussie suppose :", o: ["Des objectifs communs clairs et des chemins variés", "L'absence d'objectifs", "Un groupe parfaitement homogène", "Plus de cours magistral"], e: "Sans objectif commun clair, on ne sait pas quoi garantir à tous. Les chemins, eux, s'adaptent aux besoins." },
    { q: "L'hétérogénéité d'un groupe est :", o: ["Une réalité normale dont il faut tenir compte", "Une faute des stagiaires", "Un cas très rare", "Un problème à éliminer par un tri"], e: "Les parcours, âges, niveaux et expériences varient toujours. La différenciation est la réponse pédagogique à cette réalité." }
  ] },
{ id: 8, t: "Ludopédagogie appliquée aux compétences comportementales et techniques", short: "Apprendre par le jeu, avec un débriefing",
  def: "La ludopédagogie utilise le jeu (jeux de rôle, jeux sérieux, défis, simulations, quiz) pour faire apprendre des compétences techniques et comportementales. Le jeu est un moyen : il doit servir un objectif pédagogique précis et se terminer par un débriefing.",
  pts: ["Serious game : jeu conçu pour apprendre. Gamification : éléments de jeu (points, badges, niveaux) ajoutés à une activité non ludique.", "Le débriefing transforme l'expérience vécue en apprentissage.", "Les jeux de rôle conviennent aux compétences comportementales : communication, travail d'équipe, gestion de conflit.", "Précautions : règles claires, objectifs alignés, compétition qui ne démotive pas."],
  kw: ["Serious game", "Gamification", "Jeu de rôle", "Débriefing", "Motivation"],
  ex: "Un escape game réseau : chaque équipe répare une panne (IP, masque, passerelle) pour obtenir le code suivant, puis la classe débriefe les démarches utilisées.",
  q: [
    { q: "Un jeu pédagogique est vraiment utile lorsque :", o: ["Il est relié à un objectif précis et suivi d'un débriefing", "Il occupe simplement le temps", "Il remplace tout le cours", "Il récompense uniquement le plus rapide"], e: "Sans objectif et sans retour réflexif, le jeu reste un divertissement. Le débriefing fait émerger les apprentissages." },
    { q: "Ajouter des points et des badges à un exercice ordinaire relève de :", o: ["La gamification", "Du serious game", "Du transfert lointain", "De la maïeutique"], e: "La gamification emprunte des mécaniques de jeu pour motiver. Un serious game est un jeu entier conçu pour apprendre." },
    { q: "Un serious game est :", o: ["Un jeu conçu avec un but d'apprentissage", "N'importe quel jeu vidéo commercial", "Une forme de sanction", "Un type d'examen"], e: "Le « sérieux » désigne l'intention pédagogique : le scénario du jeu vise des compétences précises." },
    { q: "Quelle compétence comportementale se travaille bien avec un jeu de rôle ?", o: ["La gestion d'un client mécontent", "Le calcul d'un masque de sous-réseau", "Le sertissage d'un câble", "Le montage d'une baie"], e: "Le jeu de rôle met en scène des interactions humaines : écoute, communication, gestion de conflit." },
    { q: "L'étape du débriefing sert à :", o: ["Analyser ce qui s'est passé et en tirer des apprentissages", "Décerner un prix au gagnant", "Rejouer immédiatement", "Mesurer la chance des équipes"], e: "On revient sur les décisions, les émotions et les stratégies pour relier le jeu aux objectifs et au travail réel." },
    { q: "Un risque de la ludopédagogie est :", o: ["Que le jeu devienne un divertissement sans lien avec l'objectif", "Que les stagiaires apprennent trop", "Que le formateur n'ait plus aucun rôle", "Qu'il n'y ait aucun risque"], e: "Le formateur reste essentiel : il cadre, anime et débriefe. Sans alignement sur l'objectif, le jeu perd son intérêt." }
  ] },
{ id: 9, t: "Inclusion et accessibilité en centre de formation professionnelle", short: "Adapter l'environnement à la diversité",
  def: "L'inclusion vise à ce que tous les stagiaires, y compris ceux en situation de handicap ou ayant des besoins spécifiques, puissent participer pleinement et réussir, en adaptant l'environnement plutôt qu'en demandant à la personne de s'adapter seule. L'accessibilité en est la condition concrète : locaux, supports, méthodes.",
  pts: ["Intégration : la personne s'adapte au système. Inclusion : le système s'adapte à la diversité.", "Conception universelle de l'apprentissage (CUA / UDL) : plusieurs moyens d'engagement, de représentation de l'information et d'expression.", "Aménagements raisonnables : temps supplémentaire, supports adaptés, placement dans la salle, aides techniques.", "Supports accessibles : police lisible, bons contrastes, sous-titres, documents numériques structurés."],
  kw: ["Inclusion", "Accessibilité", "CUA / UDL", "Aménagements raisonnables", "Diversité"],
  ex: "Fournir le cours en PDF structuré lisible par un lecteur d'écran, avec un texte alternatif qui décrit chaque schéma réseau.",
  q: [
    { q: "Quelle phrase décrit le mieux l'inclusion ?", o: ["Le système s'adapte pour accueillir la diversité des personnes", "La personne doit se débrouiller seule", "On regroupe à part les personnes concernées", "On ignore les besoins particuliers"], e: "L'inclusion déplace l'effort : c'est l'environnement de formation qui change, pas seulement la personne." },
    { q: "La conception universelle de l'apprentissage propose :", o: ["Plusieurs moyens de représentation, d'action et d'engagement", "Une seule méthode pour tous", "Un seul support imposé", "Un seul rythme obligatoire"], e: "Prévoir dès la conception plusieurs voies d'accès bénéficie à tous, pas seulement aux personnes en situation de handicap." },
    { q: "Quel exemple est un aménagement raisonnable pour un stagiaire qui a des difficultés de lecture ?", o: ["Police lisible et temps supplémentaire à l'examen", "Supprimer l'examen", "Le placer tout au fond de la salle", "Lui interdire de lire à voix haute"], e: "Un aménagement compense la difficulté sans changer l'exigence de la compétence évaluée." },
    { q: "Pour un stagiaire malentendant, quelle mesure facilite l'accès au contenu ?", o: ["Sous-titrer les vidéos et se placer face au groupe", "Parler plus vite", "Couper le son des vidéos", "Supprimer les supports vidéo"], e: "Le sous-titrage et un visage visible aident la lecture labiale et la compréhension, au bénéfice de tout le groupe." },
    { q: "Un document accessible est notamment :", o: ["Structuré en titres, lisible, avec texte alternatif sur les images", "Un scan d'image sans texte", "Écrit en très petits caractères", "Basé sur la couleur seule pour donner l'information"], e: "La structure et le texte alternatif permettent aux lecteurs d'écran de restituer le document. La couleur seule exclut les personnes daltoniennes." },
    { q: "L'accessibilité en centre de formation concerne :", o: ["Les locaux, les supports pédagogiques et les modalités d'évaluation", "Uniquement les rampes d'accès", "Uniquement le site web", "Uniquement les horaires"], e: "Elle est globale : aller au centre, comprendre les contenus, participer aux activités et être évalué équitablement." }
  ] },
{ id: 10, t: "Posture réflexive du formateur sur sa pratique en atelier/centre", short: "Analyser sa pratique pour l'améliorer",
  def: "La posture réflexive est l'attitude du formateur qui analyse régulièrement sa propre pratique (ce qu'il fait, pourquoi, avec quels résultats) pour l'améliorer. Le « praticien réflexif » (Schön, Perrenoud) apprend de son expérience au lieu de simplement la répéter.",
  pts: ["Schön : réflexion dans l'action (pendant) et réflexion sur l'action (après).", "Cycle de Kolb : expérience concrète, observation réflexive, conceptualisation abstraite, expérimentation active.", "Outils : journal de bord, portfolio, analyse de pratique entre pairs, observation croisée, retours des stagiaires.", "La réflexion débouche sur une décision d'amélioration, pas seulement sur un constat."],
  kw: ["Schön", "Perrenoud", "Kolb", "Journal de bord", "Analyse de pratique", "Observation croisée"],
  ex: "Après un TP où la moitié du groupe a bloqué, le formateur note ce qui s'est passé, repère une consigne ambiguë et la réécrit pour la séance suivante.",
  q: [
    { q: "Qui a développé l'idée du « praticien réflexif » ?", o: ["Donald Schön", "Benjamin Bloom", "B. F. Skinner", "Frederick Taylor"], e: "Schön a montré que les professionnels apprennent en réfléchissant à leur action. Perrenoud l'a ensuite transposé à l'enseignement." },
    { q: "Ajuster son explication en plein cours parce que les stagiaires semblent perdus relève de :", o: ["La réflexion dans l'action", "La réflexion sur l'action", "L'évaluation sommative", "La différenciation des productions"], e: "On analyse et on corrige pendant que l'on agit : c'est la réflexion dans l'action." },
    { q: "Dans le cycle de Kolb, après l'expérience concrète et l'observation réflexive, viennent :", o: ["La conceptualisation abstraite puis l'expérimentation active", "L'évaluation puis la note", "La mémorisation puis l'oubli", "L'examen puis le certificat"], e: "Kolb décrit un cycle : vivre, observer, théoriser, puis tester de nouvelles façons de faire." },
    { q: "Quel outil favorise l'analyse de sa pratique dans la durée ?", o: ["Le journal de bord", "La liste de présence", "Le planning des salles", "L'emploi du temps"], e: "Noter régulièrement ce qui s'est passé permet de repérer des récurrences et de mesurer des progrès." },
    { q: "La posture réflexive aboutit idéalement à :", o: ["Des changements concrets de pratique", "Une justification de tout ce qui a été fait", "Un constat sans suite", "L'abandon de la fonction"], e: "Réfléchir n'a de valeur que si cela transforme la pratique : consigne réécrite, activité modifiée, évaluation ajustée." },
    { q: "L'observation croisée entre formateurs permet de :", o: ["Recevoir un regard extérieur constructif sur sa pratique", "Contrôler et sanctionner un collègue", "Comparer les salaires", "Remplacer les séances de cours"], e: "Un collègue voit ce que l'on ne voit plus soi-même. Le cadre doit être bienveillant et centré sur l'amélioration." }
  ] },
{ id: 11, t: "Scénarisation pédagogique articulant théorie, pratique", short: "Construire une séance qui alterne apport et mise en pratique",
  def: "La scénarisation pédagogique est la conception d'une séance ou d'une séquence : objectifs, enchaînement des activités, durées, modalités (individuel, groupe), ressources et évaluation. Elle articule la théorie (apports) et la pratique (mise en situation) pour que l'une donne du sens à l'autre.",
  pts: ["Séance type : accroche ou situation-problème, apport théorique court, application guidée, application autonome, synthèse, évaluation.", "« Je fais, nous faisons, tu fais » : le guidage diminue progressivement.", "Alternance théorie/pratique : théorie juste-à-temps, au moment où le besoin apparaît.", "Variantes : classe inversée, apprentissage par problèmes, démonstration puis TP."],
  kw: ["Scénario pédagogique", "Situation-problème", "Alternance", "Guidage progressif", "Classe inversée"],
  ex: "Séance sur le routage : panne simulée en accroche, 10 min d'apport sur la table de routage, TP guidé sur deux routeurs, puis TP autonome sur trois routeurs.",
  q: [
    { q: "Un scénario pédagogique décrit :", o: ["Objectifs, activités, durées, modalités, ressources et évaluation", "Uniquement les diapositives", "Uniquement la liste des présents", "Uniquement le budget"], e: "C'est le plan détaillé de la séance : il rend la pratique du formateur prévisible, partageable et améliorable." },
    { q: "Dans « je fais, nous faisons, tu fais », la première étape correspond à :", o: ["La démonstration par le formateur", "L'autonomie totale du stagiaire", "L'évaluation finale", "Un jeu de rôle"], e: "Le formateur montre d'abord, puis fait avec le groupe, puis laisse le stagiaire faire seul : le guidage décroît." },
    { q: "Que signifie apporter la théorie « juste-à-temps » ?", o: ["La donner au moment où le besoin apparaît dans la pratique", "Tout donner en début de formation", "La supprimer du cours", "La réserver à la fin de l'année"], e: "Un besoin ressenti donne du sens : la théorie est mieux retenue quand elle répond à une difficulté vécue." },
    { q: "Quel ordre est le plus cohérent pour une séance technique ?", o: ["Accroche, apport court, pratique guidée, pratique autonome, synthèse", "Synthèse, apport long, évaluation, accroche", "Évaluation sommative, puis cours théorique complet", "Pratique autonome, puis démonstration"], e: "On motive d'abord, on outille ensuite, on guide, on laisse faire seul, puis on consolide par une synthèse." },
    { q: "La classe inversée consiste à :", o: ["Découvrir le contenu avant la séance et consacrer le temps en présentiel à la pratique", "Faire le cours dans l'ordre inverse", "Inverser les rôles avec l'administration", "Supprimer toute pratique"], e: "Les apports se font à distance (vidéos, lectures). Le temps en centre sert aux exercices, aux questions et à l'accompagnement." },

7: { tip: "Tous les randonneurs montent au même sommet (objectif commun), mais par des sentiers différents, avec un rythme et un équipement adaptés. Différencier, c'est choisir le sentier, pas abaisser le sommet.",

  q: [

    { q: "Proposer une ressource au choix (texte, vidéo ou démonstration) relève de la différenciation :", o: ["Des processus", "Du contrat pédagogique", "De la sanction", "De l'évaluation sommative"], e: "On varie le chemin d'apprentissage pour que chacun accède au même contenu par la voie qui lui convient." },
    { q: "Quel outil de départ permet de situer les acquis de chacun avant un module ?", o: ["Un test de positionnement sur les prérequis", "L'examen final", "Le certificat", "La liste de présence"], e: "Le test de positionnement (évaluation diagnostique) éclaire les écarts et guide l'organisation des activités." },

8: { tip: "Un TP sans débriefing, c'est un match sans analyse vidéo : on a joué, mais on n'a pas progressé. Le jeu est le véhicule, le débriefing est le chemin qui mène à l'apprentissage.",
  mn: "Vivre, Raconter, Comprendre, Réutiliser : les 4 temps d'un jeu pédagogique réussi.",
  conf: [["Gamification ou serious game ?", "Gamification : on ajoute points, badges et niveaux à une activité. Serious game : un jeu entier conçu pour apprendre."], ["Jeu de rôle ou simulation ?", "Jeu de rôle : on joue des personnes (client, collègue). Simulation : on reproduit un système ou une situation technique (Packet Tracer)."], ["Compétition ou coopération", "La compétition motive certains mais décourage d'autres. Les scores d'équipe coopératifs sont souvent plus inclusifs."]],
  piege: "Un jeu amusant mais sans objectif aligné ni débriefing est du divertissement, pas de la pédagogie.",
  aut: ["Johan Huizinga : Homo ludens, le jeu comme fait de culture.", "Roger Caillois : classification des jeux.", "Mihaly Csikszentmihalyi : état de flow.", "Julian Alvarez et Damien Djaouti : serious games."],
  q: [
    { q: "L'état de « flow » (Csikszentmihalyi) apparaît lorsque :", o: ["Le défi est bien équilibré avec le niveau de compétence", "Le défi est trop facile", "Le défi est impossible", "Il n'y a aucun but"], e: "Trop facile, on s'ennuie ; trop difficile, on s'angoisse. Un bon jeu pédagogique maintient l'équilibre." },
    { q: "Un laboratoire virtuel de type Packet Tracer est surtout :", o: ["Une simulation d'une situation réelle simplifiée", "Un jeu de rôle", "Un examen oral", "Une gamification"], e: "La simulation reproduit un système réel pour s'exercer sans risque ni coût de matériel." },
    { q: "Un risque d'un usage excessif de badges et de classements est de :", o: ["Faire dépendre la motivation de la récompense plutôt que de l'intérêt", "Faire trop apprendre", "Supprimer l'effort", "Interdire la collaboration"], e: "La motivation extrinsèque peut remplacer la motivation interne. Mieux vaut valoriser la progression et la coopération." },
    { q: "Pendant un jeu de groupe, le formateur :", o: ["Observe, note des faits et prépare le débriefing", "Quitte la salle", "Joue à la place des stagiaires", "Donne toutes les solutions"], e: "Ses notes d'observation nourrissent le débriefing, moment où l'apprentissage se formalise." },
    { q: "Un quiz en direct de type Kahoot apporte surtout :", o: ["Un retour immédiat et un fort engagement", "Une certification officielle", "La suppression du cours", "Une évaluation sommative fiable à elle seule"], e: "Le feedback instantané repère les incompréhensions en temps réel, mais ne remplace pas une évaluation de compétences." },
    { q: "Quelle question de débriefing relie le jeu à la réalité ?", o: ["« Qu'allez-vous réutiliser de cette expérience dans votre travail ? »", "« Qui a gagné ? »", "« Qui a triché ? »", "« Qui veut rejouer ? »"], e: "Un bon débriefing suit : ce qui s'est passé, ce que l'on a ressenti, ce que l'on a appris, ce que l'on retient pour le travail." }
  ] },
9: { tip: "Le trottoir abaissé a été conçu pour les fauteuils roulants, mais il sert aussi aux poussettes, aux valises et aux livreurs. De même, des sous-titres ou un support structuré aident tout le groupe, pas seulement une personne.",

10: { tip: "En conduisant, on regarde le pare-brise (agir) mais aussi le rétroviseur (réfléchir). Un formateur réflexif prend le temps du rétroviseur après chaque séance, puis ajuste la trajectoire.",
  mn: "Quoi ? Et alors ? Et maintenant ? = Décrire, Comprendre, Décider (modèle de Rolfe).",
  conf: [["Réflexion ou rumination ?", "La réflexion s'appuie sur des faits, aboutit à une décision. La rumination tourne en boucle sans résultat."], ["Simple ou double boucle ?", "Simple boucle : on corrige l'action. Double boucle : on remet en cause les hypothèses qui ont conduit à cette action."], ["Dans l'action ou sur l'action", "Dans l'action : on ajuste pendant la séance. Sur l'action : on analyse après."]],

  aut: ["Donald Schön (1983) : le praticien réflexif.", "Philippe Perrenoud : pratique réflexive et métier d'enseignant.", "David Kolb (1984) : apprentissage expérientiel.", "Argyris et Schön : apprentissage en simple et double boucle.", "Gillie Rolfe : modèle Quoi ? Et alors ? Et maintenant ?"],
  q: [

    { q: "Dans la méthode « Quoi ? Et alors ? Et maintenant ? », l'étape « Et maintenant ? » concerne :", o: ["La décision d'action", "La description des faits", "L'analyse des causes", "La note finale"], e: "Quoi ? = décrire. Et alors ? = analyser, donner du sens. Et maintenant ? = décider ce que l'on changera." },
    { q: "Quel outil donne un retour des stagiaires en cours de formation ?", o: ["Un questionnaire anonyme à mi-parcours", "Le règlement intérieur", "Le planning des salles", "Un bulletin de paie"], e: "Un retour intermédiaire permet d'ajuster avant la fin, contrairement à l'évaluation à chaud finale." },
    { q: "Quelle différence existe entre réflexion et rumination ?", o: ["La réflexion débouche sur une analyse et une décision, la rumination tourne en boucle", "Il n'y en a aucune", "La rumination est plus constructive", "La réflexion exclut toute émotion"], e: "Un cadre (questions, écrit, regard extérieur) évite de ressasser sans résultat." },
    { q: "40 % des stagiaires ont échoué à une évaluation. Quelle démarche est réflexive ?", o: ["Analyser l'alignement, les consignes, la durée et les activités avant de conclure", "Accuser le groupe", "Baisser la barre sans analyse", "Ne rien changer"], e: "Avant d'attribuer l'échec aux stagiaires, on interroge sa propre pratique : objectifs, séances, évaluation." },
    { q: "Un portfolio professionnel de formateur permet de :", o: ["Conserver des traces de sa pratique et de ses progrès", "Remplacer le cours", "Classer les stagiaires", "Calculer les salaires"], e: "Il rassemble séquences, retours et analyses, pour objectiver sa progression." }
  ] },
11: { tip: "Un formateur est un réalisateur : il découpe en scènes, soigne le rythme et évite le monologue de deux heures. Après environ un quart d'heure d'écoute passive, l'attention baisse : une courte activité relance tout.",

    { q: "La méthode démonstrative consiste à :", o: ["Montrer le geste ou la procédure, puis faire reproduire", "Faire découvrir seul sans aide", "Interroger en cascade", "Exposer sans montrer"], e: "Le formateur démontre, le stagiaire reproduit. Cette méthode convient aux gestes techniques et aux procédures." },
    { q: "Dans la méthode active, le stagiaire :", o: ["Découvre en manipulant ou en cherchant", "Écoute passivement", "Recopie le cours", "Attend la correction"], e: "Il construit lui-même la connaissance à partir d'un problème, d'une manipulation ou d'un projet." },
    { q: "Un cours de deux heures entièrement magistral sur OSPF pose surtout problème parce que :", o: ["L'attention baisse et il n'y a aucune pratique pour ancrer les notions", "OSPF est interdit", "Les stagiaires aiment trop la pratique", "La théorie ne sert à rien"], e: "Alterner de courtes explications et des activités maintient l'attention et fixe les acquis." },

12: { tip: "Le formateur est comme un arbitre : il connaît les règles, les applique à tous, ne joue pour aucune équipe, mais il n'est pas absent du terrain. Il siffle une faute de respect ou de sécurité, même si cela dérange.",

  q: [

    { q: "Un stagiaire avoue avoir accédé sans autorisation au réseau de son employeur. Quelle réaction est adaptée ?", o: ["Rappeler le cadre légal et déontologique et orienter vers le référent compétent", "Le féliciter", "Lui demander de recommencer pour voir", "Ne rien dire et approuver"], e: "Le formateur ne cautionne pas un acte illégal. Il rappelle la règle et agit selon la procédure de l'établissement." },
    { q: "Une entreprise partenaire vous offre un cadeau de valeur avant l'évaluation de ses stagiaires. Que faire ?", o: ["Décliner et informer sa hiérarchie", "L'accepter discrètement", "Le garder en cachant l'origine", "Modifier les notes en retour"], e: "Un cadeau peut créer un conflit d'intérêts réel ou apparent. La transparence protège le formateur et l'équité." },

    { q: "Quelle phrase du formateur est la plus métacognitive ?", o: ["« Qu'est-ce qui t'a aidé à comprendre cette notion ? »", "« Retiens ça par cœur. »", "« Dépêche-toi. »", "« C'est dans le programme. »"], e: "Cette question invite le stagiaire à regarder sa propre façon d'apprendre et à repérer ce qui marche pour lui." },
    { q: "Pourquoi l'erreur est-elle précieuse en métacognition ?", o: ["Elle renseigne sur la démarche et permet de la corriger", "Elle prouve l'incapacité", "Elle doit être cachée", "Elle justifie une sanction"], e: "Analysée sans jugement, l'erreur montre à quel moment la démarche a dévié et comment la changer." },
    { q: "Un stagiaire note chaque semaine ce qu'il a compris, ce qui l'a bloqué et ce qu'il va essayer. Quel outil utilise-t-il ?", o: ["Un journal de bord d'apprentissage", "Un registre de présence", "Un règlement intérieur", "Un bulletin de notes"], e: "Le journal de bord entretient l'habitude de regarder son propre apprentissage et de décider des actions suivantes." },
    { q: "Le modelage consiste, pour le formateur, à :", o: ["Montrer sa propre démarche en pensant à voix haute", "Demander de recopier le cours", "Sanctionner les erreurs", "Donner le corrigé sans explication"], e: "En rendant visible son raisonnement, le formateur donne un modèle que le stagiaire peut imiter puis s'approprier." }
  ] },
2: { sch: "Du guidage à l'autonomie",
  ex2: [["Le besoin de savoir", "Avant d'apprendre, l'adulte veut savoir à quoi cela lui servira. Annoncez l'utilité dès le départ."], ["Autonomie et expérience", "Il veut choisir et participer, et il arrive avec un vécu. Utilisez ce vécu comme point de départ."], ["Problèmes réels", "Il apprend mieux avec des situations concrètes de son métier qu'avec de la théorie isolée."], ["Motivation interne", "Ce qui l'engage : progresser, être reconnu, réussir sa carrière. La note seule suffit rarement."]],
  p2: ["Contrat pédagogique en début de module : objectifs, règles, attentes.", "Le formateur facilite : il pose des questions, organise des échanges, met en situation.", "Respecter l'adulte : ne pas l'infantiliser, éviter les remarques humiliantes devant le groupe."],
  gl: [["Andragogie", "Art d'aider les adultes à apprendre."], ["Pédagogie", "Art d'enseigner, à l'origine tourné vers l'enfant."], ["Facilitateur", "Formateur qui accompagne l'apprentissage plutôt qu'il ne dicte."], ["Contrat pédagogique", "Accord sur les objectifs, les règles et les attentes."], ["Autonomie", "Capacité de décider et de gérer son apprentissage."], ["Apprentissage expérientiel", "Apprendre à partir de l'expérience vécue puis analysée."], ["Besoin de savoir", "Besoin de comprendre l'utilité avant d'apprendre."], ["Motivation interne", "Envie d'apprendre qui vient de la personne elle-même."]],
  q: [
    { q: "Quel est le premier réflexe andragogique au début d'un module ?", o: ["Expliquer les objectifs et leur utilité dans le métier", "Commencer l'examen", "Distribuer des sanctions", "Lire le règlement de A à Z"], e: "Le besoin de savoir est le premier principe de Knowles : l'adulte s'engage quand il voit à quoi cela sert." },
    { q: "Infantiliser un stagiaire adulte devant le groupe risque de :", o: ["Diminuer son engagement et sa participation", "Augmenter sa motivation", "Améliorer la discipline durablement", "Renforcer son autonomie"], e: "L'adulte attend d'être respecté comme un professionnel. L'humiliation provoque retrait et résistance." },
    { q: "Le formateur facilitateur :", o: ["Pose des questions et organise les échanges", "Parle seul tout le temps", "Interdit les initiatives", "Évalue sans expliquer"], e: "Il crée les conditions de l'apprentissage : questions, mises en situation, échanges, retours." },
    { q: "Quel élément fait partie du contrat pédagogique ?", o: ["Objectifs, règles de fonctionnement et attentes réciproques", "Le salaire du formateur", "Le prix du matériel", "La météo du jour"], e: "Le contrat pédagogique clarifie ce que chacun attend et s'engage à faire. Il soutient la responsabilité de l'adulte." },
    { q: "L'apprentissage expérientiel signifie qu'on apprend :", o: ["À partir d'expériences vécues puis analysées", "Sans jamais pratiquer", "En copiant le cours", "Uniquement par la lecture"], e: "L'expérience seule ne suffit pas : c'est son analyse qui produit l'apprentissage (voir le cycle de Kolb)." },
    { q: "Un stagiaire adulte dit : « Je fais déjà ça au travail. » Quelle réponse est andragogique ?", o: ["« Super, racontez comment vous procédez, nous partirons de là. »", "« Ce n'est pas vous qui enseignez. »", "« Taisez-vous. »", "« Alors vous n'avez rien à apprendre. »"], e: "Valoriser l'expérience et la confronter aux savoirs du cours est au cœur de l'andragogie." }
  ] },
3: { sch: "Le triangle de l'alignement",
  ex2: [["1. Définir la compétence", "Ce que le stagiaire doit être capable de faire, dans quelle situation, avec quels critères. Exemple : configurer un VLAN sur un switch en 10 minutes sans erreur."], ["2. Choisir la preuve", "Quelle tâche montrera la maîtrise ? Une mise en situation, un TP, un projet. Définissez les critères de réussite."], ["3. Concevoir les activités", "Les exercices doivent entraîner exactement à cette tâche : démonstration, TP guidé, TP autonome."], ["4. Évaluer et réguler", "Évaluation formative en cours de route pour ajuster, sommative à la fin pour certifier."]],
  p2: ["Ce qui est évalué doit avoir été enseigné et travaillé.", "Les stagiaires doivent connaître les critères avant d'être évalués.", "Un référentiel de compétences décrit le métier, pas une liste de chapitres."],
  gl: [["Alignement pédagogique", "Cohérence entre objectifs, activités et évaluation."], ["Compétence", "Savoir-agir en situation en mobilisant des ressources."], ["Critère de performance", "Condition précise qui permet de juger la réussite."], ["Référentiel", "Document qui décrit les compétences et exigences d'un métier."], ["Taxonomie de Bloom", "Classification des niveaux d'apprentissage."], ["Évaluation diagnostique", "Faite au début pour connaître les acquis."], ["Évaluation formative", "Faite pendant pour aider à progresser."], ["Évaluation sommative", "Faite à la fin pour faire le bilan et certifier."]],
  q: [
    { q: "Qu'est-ce qu'un critère de performance ?", o: ["Une condition précise qui permet de juger la réussite d'une tâche", "Une note moyenne", "Un horaire de cours", "Le nom d'un module"], e: "Exemple : « le ping aboutit entre les deux VLAN en moins de 10 minutes ». Le critère rend le jugement objectif." },
    { q: "Quelle évaluation se fait en début de module pour connaître les acquis ?", o: ["Diagnostique", "Sommative", "Certificative", "Finale"], e: "Diagnostique : avant. Formative : pendant. Sommative : après." },
    { q: "Un référentiel de compétences décrit :", o: ["Ce que le professionnel doit savoir faire en situation de travail", "Le planning du centre", "Les tarifs de formation", "Le règlement intérieur"], e: "Le référentiel part du métier réel. Les programmes et les évaluations s'en déduisent." },
    { q: "Dans quel ordre travaille-t-on en conception à rebours ?", o: ["Compétence visée, preuves de maîtrise, activités", "Activités, compétence visée, preuves", "Évaluation, cours, objectif", "Supports, examen, compétence"], e: "On part de la fin : que doit savoir faire le stagiaire, comment le prouvera-t-il, et seulement ensuite on construit les activités." },
    { q: "Un TP noté sur des compétences jamais travaillées en séance illustre :", o: ["Un manque d'alignement", "Une différenciation", "Un transfert", "Un serious game"], e: "On évalue ce qui n'a pas été enseigné ni entraîné : objectifs, activités et évaluation ne concordent pas." },
    { q: "Le niveau « appliquer » de Bloom correspond à :", o: ["Utiliser une procédure dans une situation donnée", "Définir un mot", "Créer une nouvelle architecture", "Comparer des théories"], e: "Appliquer, c'est mettre en œuvre une méthode connue dans un cas concret, par exemple configurer une route statique." }
  ] },
4: { sch: "Une mémoire de travail qui déborde ou non",
  ex2: [["La mémoire de travail est petite", "C'est l'espace où l'on traite l'information consciemment. Elle contient peu d'éléments et s'efface vite."], ["Trois charges s'additionnent", "Contenu (intrinsèque) + présentation (extrinsèque) + construction de sens (pertinente). Si le total dépasse la capacité, on décroche."], ["Que faire ?", "Réduire l'inutile : textes lourds, décors, informations en double. Découper. Utiliser des exemples résolus."], ["Adapter au niveau", "Le novice a besoin de plus de guidage, l'expert de moins. Retirez l'aide progressivement."]],
  p2: ["Un schéma bien fait remplace souvent un long paragraphe.", "Un seul message principal par diapositive.", "Les pauses et les mini-synthèses permettent de consolider."],
  gl: [["Mémoire de travail", "Espace limité où l'on traite l'information."], ["Mémoire à long terme", "Stockage durable des connaissances."], ["Schéma mental", "Structure de connaissances organisées en mémoire."], ["Charge intrinsèque", "Difficulté propre au contenu."], ["Charge extrinsèque", "Effort inutile dû à la présentation."], ["Charge pertinente", "Effort utile pour comprendre."], ["Exemple résolu", "Problème présenté avec sa solution détaillée."], ["Segmentation", "Découpage d'un contenu en petites étapes."]],
  q: [
    { q: "Quel est le rôle de la mémoire à long terme ?", o: ["Stocker durablement des connaissances organisées en schémas", "Traiter vingt éléments à la fois", "Effacer ce qu'on apprend", "Remplacer la mémoire de travail"], e: "Quand une connaissance est bien rangée en mémoire à long terme, elle occupe très peu de place en mémoire de travail." },
    { q: "Quel changement réduit la charge extrinsèque d'une diapositive ?", o: ["Retirer les éléments décoratifs et garder un seul message", "Ajouter plus de texte", "Ajouter des animations", "Réduire la taille des caractères"], e: "Tout ce qui n'aide pas à comprendre consomme de la mémoire de travail pour rien." },
    { q: "Un exemple résolu est utile surtout pour :", o: ["Les débutants", "Les experts uniquement", "Personne", "Les évaluations seulement"], e: "Le novice n'a pas encore de schémas : voir une solution détaillée lui évite de chercher au hasard." },
    { q: "Pourquoi segmenter un contenu complexe ?", o: ["Pour ne pas dépasser la capacité de la mémoire de travail", "Pour rallonger la formation", "Pour supprimer la pratique", "Pour éviter les questions"], e: "Quelques éléments à la fois, consolidés avant de passer aux suivants." },
    { q: "Un schéma bien construit aide parce qu'il :", o: ["Organise l'information et réduit l'effort de recherche", "Remplace toute explication orale", "Est toujours inutile", "Augmente la charge"], e: "En regroupant les éléments et leurs liens, le schéma se traite comme un seul bloc." },
    { q: "Un stagiaire expérimenté s'ennuie avec des explications très détaillées. Quel effet est en jeu ?", o: ["L'effet d'inversion de l'expertise", "L'effet d'attention divisée", "L'effet de halo", "L'effet de ludification"], e: "Les aides utiles au débutant deviennent redondantes pour l'expert et peuvent même le gêner." }
  ] },
5: { sch: "Les trois temps du questionnement",
  ex2: [["Décrire d'abord", "Avant d'analyser, faire raconter les faits : « Qu'as-tu fait ? Dans quel ordre ? »."], ["Analyser ensuite", "Chercher les causes et les liens : « Qu'est-ce qui a fonctionné ? Qu'est-ce qui a posé problème ? »."], ["Améliorer enfin", "Faire formuler une décision : « Que ferais-tu différemment la prochaine fois ? »."], ["Les gestes qui aident", "Un silence de quelques secondes, la reformulation, la relance neutre, une seule question à la fois."]],
  p2: ["La qualité de la question détermine la qualité de la réflexion.", "On évite les questions à double sens ou piégées.", "On valorise les réponses, même incomplètes, avant de les compléter."],
  gl: [["Question ouverte", "Appelle une réponse développée."], ["Question fermée", "Appelle oui, non ou un mot."], ["Relance", "Question qui invite à poursuivre."], ["Reformulation", "Redire avec d'autres mots pour clarifier."], ["Explicitation", "Faire décrire l'action vécue."], ["Maïeutique", "Faire accoucher les idées par les questions."], ["Question inductrice", "Question qui suggère la réponse."], ["Analyse de pratique", "Examen méthodique d'une pratique professionnelle."]],
  q: [
    { q: "Quelle question est fermée ?", o: ["« As-tu testé le câble ? »", "« Comment as-tu procédé ? »", "« Qu'est-ce qui t'a surpris ? »", "« Que ferais-tu autrement ? »"], e: "Elle appelle oui ou non. Les trois autres demandent un récit ou une analyse." },
    { q: "Que fait la reformulation dans un entretien ?", o: ["Elle vérifie qu'on a bien compris et invite à préciser", "Elle corrige l'erreur", "Elle clôt l'échange", "Elle donne la solution"], e: "Redire avec ses mots montre qu'on écoute et permet à l'autre de rectifier ou de compléter." },
    { q: "Quelle séquence est la plus logique pour analyser une pratique ?", o: ["Décrire, analyser, améliorer", "Améliorer, décrire, juger", "Juger, décrire, oublier", "Noter, sanctionner, conclure"], e: "On commence par les faits, puis les causes, puis la décision d'amélioration." },
    { q: "La maïeutique est une technique qui :", o: ["Aide l'autre à trouver la réponse en lui posant des questions", "Donne la réponse tout de suite", "Évalue sommativement", "Interdit de parler"], e: "Héritée de Socrate, elle fait émerger les idées de l'interlocuteur par un questionnement progressif." },
    { q: "Quelle attitude du formateur favorise la prise de parole ?", o: ["Accueillir toute réponse sans moquerie, puis la compléter", "Corriger durement", "Ignorer les réponses", "Interrompre systématiquement"], e: "La sécurité psychologique est une condition de la parole : on ose répondre quand on ne risque pas l'humiliation." },
    { q: "Quelle question vise la décision d'amélioration ?", o: ["« Que feras-tu différemment la prochaine fois ? »", "« Qui est responsable ? »", "« Pourquoi tu rates toujours ? »", "« Tu as fini ? »"], e: "C'est la question du troisième temps : transformer l'analyse en action concrète." }
  ] },
6: { sch: "Transférer : avant, pendant, après",
  ex2: [["Avant la formation", "Clarifier l'objectif avec le stagiaire et son responsable. Le stagiaire sait où il utilisera ses acquis."], ["Pendant la formation", "Situations proches du réel, cas variés, pratique répétée, question « et si le contexte change ? »."], ["Après la formation", "Plan d'action, rappels, suivi par le responsable, retour d'expérience."], ["Mesurer", "Kirkpatrick : 1 réaction, 2 apprentissage, 3 comportement au travail, 4 résultats pour l'organisation."]],
  p2: ["Le transfert est la vraie finalité de la formation professionnelle.", "Le soutien du manager est l'un des facteurs les plus puissants.", "Plus les situations d'entraînement sont variées, plus le transfert lointain est probable."],
  gl: [["Transfert", "Réutilisation des acquis dans une autre situation."], ["Transfert proche", "Situation similaire à celle de la formation."], ["Transfert lointain", "Situation sensiblement différente."], ["Situation authentique", "Tâche proche de la réalité du travail."], ["Plan d'action", "Engagements concrets pour appliquer les acquis."], ["Kirkpatrick", "Modèle d'évaluation en quatre niveaux."], ["Environnement de travail", "Contexte qui soutient ou freine l'application."], ["Abstraction", "Dégager le principe général d'un cas particulier."]],
  q: [
    { q: "Quelle phrase décrit le mieux le transfert ?", o: ["Utiliser en situation de travail ce qu'on a appris en formation", "Réussir l'examen", "Mémoriser le cours", "Suivre toutes les séances"], e: "On peut réussir un examen sans transférer. Le transfert se voit dans le comportement au travail." },
    { q: "Quel élément de l'environnement de travail favorise le transfert ?", o: ["Un responsable qui soutient l'application des nouveautés", "Un outil interdit", "Une absence totale de temps", "Un climat de peur"], e: "Même bien formé, un salarié n'applique que si le contexte le permet et l'encourage." },
    { q: "Pourquoi faire varier les exemples ?", o: ["Pour aider le stagiaire à dégager le principe commun", "Pour embrouiller", "Pour gagner du temps", "Pour éviter la pratique"], e: "En voyant le même principe dans plusieurs contextes, le stagiaire repère ce qui est général et ce qui est particulier." },
    { q: "Niveau 1 de Kirkpatrick :", o: ["Réaction (satisfaction)", "Apprentissage", "Comportement", "Résultats"], e: "Niveau 1 : réaction. Niveau 2 : apprentissage. Niveau 3 : comportement. Niveau 4 : résultats." },
    { q: "Un stagiaire applique avec succès un protocole appris sur l'équipement d'un autre constructeur, dans une autre entreprise. C'est un exemple de :", o: ["Transfert lointain", "Transfert nul", "Désalignement", "Gamification"], e: "Le contexte a nettement changé, mais le principe a été retrouvé : c'est un transfert lointain." },
    { q: "Quel outil favorise l'application après la formation ?", o: ["Une fiche d'actions à réaliser dans les 30 jours", "Un jeu concours", "Un diaporama final", "Un règlement"], e: "Un engagement daté et précis facilite le passage à l'action." }
  ] },
7: { sch: "Un objectif commun, des chemins différents",
  ex2: [["1. Diagnostiquer", "Repérer acquis, besoins et rythmes au départ : test de positionnement, questionnaire, observation."], ["2. Choisir les leviers", "Contenus, processus, productions, environnement : que puis-je adapter sans changer l'objectif ?"], ["3. Organiser", "Groupes de besoin temporaires, tutorat, ressources à niveaux, exercices à difficulté croissante."], ["4. Réguler", "Observer, ajuster, recomposer les groupes selon les progrès."]],
  p2: ["Les objectifs restent les mêmes pour tous, les chemins varient.", "La différenciation demande de la préparation : plusieurs supports et niveaux d'aide.", "Elle valorise tout le monde : aide pour certains, défi pour d'autres."],
  gl: [["Différenciation", "Adapter les moyens pour atteindre un objectif commun."], ["Hétérogénéité", "Diversité des niveaux et des parcours d'un groupe."], ["Individualisation", "Parcours propre à chaque apprenant."], ["Remédiation", "Aide pour combler une lacune repérée."], ["Tutorat", "Aide apportée par un pair ou un tuteur."], ["Groupe de besoin", "Groupe formé selon un besoin du moment."], ["Étayage", "Aide temporaire qui se retire peu à peu."], ["Positionnement", "Test pour situer le niveau de départ."]],
  q: [
    { q: "Quel exemple illustre la différenciation des contenus ?", o: ["Proposer des exercices de difficulté différente", "Interdire les questions", "Donner la même note à tous", "Réduire les objectifs"], e: "On adapte le niveau de l'exercice, pas l'objectif final." },
    { q: "Le tutorat est profitable :", o: ["Au tuteur comme à l'aidé", "Seulement à l'aidé", "À personne", "Seulement au formateur"], e: "Expliquer à un pair oblige à reformuler et consolide ses propres acquis." },
    { q: "Quand faire un test de positionnement ?", o: ["Au début du module", "À la fin de l'année", "Après le certificat", "Jamais"], e: "Il sert à adapter la suite : il doit donc précéder l'enseignement." },
    { q: "Quel danger guette un formateur qui crée des groupes de niveau fixes ?", o: ["L'étiquetage et la baisse de motivation", "La pratique excessive", "Le manque de salles", "La surcharge du matériel"], e: "Des groupes fixes enferment les stagiaires dans une image d'eux-mêmes. Mieux vaut des groupes temporaires de besoin." },
    { q: "La remédiation consiste à :", o: ["Aider à combler une lacune repérée", "Répéter le cours à l'identique", "Sanctionner", "Supprimer des objectifs"], e: "La remédiation corrige après coup une difficulté identifiée. La différenciation, elle, adapte en continu." },
    { q: "Pourquoi l'hétérogénéité est-elle normale en formation d'adultes ?", o: ["Les parcours, expériences et niveaux sont variés", "Les stagiaires sont paresseux", "Le programme est mal fait", "Le formateur est trop strict"], e: "Chacun arrive avec une histoire différente. Le groupe parfaitement homogène n'existe pas." }
  ] },
8: { sch: "Le cycle d'un jeu pédagogique",
  ex2: [["1. Choisir l'objectif", "Que doit apprendre le stagiaire grâce au jeu ? Le choix du jeu en dépend."], ["2. Concevoir le jeu", "Règles simples, défi adapté, rôle clair, durée courte. Exemple : escape game de dépannage réseau."], ["3. Animer", "Présenter les règles, observer, encourager, noter les comportements sans trop intervenir."], ["4. Débriefer", "Raconter ce qui s'est passé, analyser, en tirer des principes et décider de les réutiliser."]],
  p2: ["Le jeu augmente l'engagement et le droit à l'erreur.", "Choisissez entre coopération et compétition en fonction de l'objectif.", "Un jeu long sans débriefing est du temps perdu."],
  gl: [["Ludopédagogie", "Apprendre par le jeu."], ["Serious game", "Jeu conçu pour apprendre."], ["Gamification", "Ajout d'éléments de jeu à une activité."], ["Jeu de rôle", "Jeu où l'on joue un personnage dans une situation."], ["Escape game", "Jeu d'énigmes à résoudre en équipe."], ["Débriefing", "Retour réflexif après l'activité."], ["Flow", "Immersion quand le défi et la compétence s'équilibrent."], ["Feedback immédiat", "Retour instantané sur l'action."]],
  q: [
    { q: "Quel est l'objectif d'un escape game pédagogique ?", o: ["Faire pratiquer des compétences en résolvant des énigmes en équipe", "Détendre uniquement", "Classer les stagiaires", "Remplacer le cours"], e: "Les énigmes sont construites pour mobiliser les compétences visées, avec collaboration et débriefing." },
    { q: "Dans un jeu pédagogique, le droit à l'erreur permet de :", o: ["Essayer sans peur et apprendre de ses erreurs", "Ne jamais corriger", "Éviter le débriefing", "Gagner à coup sûr"], e: "Une erreur dans un jeu n'a pas de conséquence réelle : on peut tester des hypothèses et comprendre." },
    { q: "Une compétition permanente avec classement public risque de :", o: ["Décourager les moins avancés", "Motiver tout le monde pareil", "Supprimer le jeu", "Améliorer l'équité"], e: "Privilégiez des scores d'équipe ou des progressions personnelles plutôt qu'un classement qui expose." },
    { q: "Quelle étape transforme l'expérience de jeu en apprentissage ?", o: ["Le débriefing", "Le chronométrage", "La remise de badges", "La musique"], e: "Le débriefing relie ce qui a été vécu aux principes à retenir et à leur usage dans le métier." },
    { q: "Un jeu de rôle est particulièrement adapté pour :", o: ["Travailler la communication et la gestion de conflits", "Mémoriser une adresse MAC", "Calculer un masque", "Monter une baie"], e: "Il met en scène des interactions humaines et permet de s'entraîner sans enjeu réel." },
    { q: "Quel élément est indispensable avant de lancer un jeu ?", o: ["Un objectif pédagogique clair", "Un prix à gagner", "Une musique", "Un chronomètre"], e: "Sans objectif, impossible de concevoir le jeu, de l'animer ou de le débriefer." }
  ] },
9: { sch: "De l'exclusion à l'inclusion",
  ex2: [["Comprendre les différences", "Chaque stagiaire a des besoins : visuels, auditifs, moteurs, cognitifs, linguistiques, sociaux."], ["Concevoir pour tous", "Varier les façons de présenter (texte, schéma, vidéo), d'engager et de faire démontrer."], ["Adapter si besoin", "Aménagements raisonnables : temps, support, place, outils, sans baisser la compétence visée."], ["Créer un climat sûr", "Respect, humour non blessant, confidentialité, valorisation de la diversité."]],
  p2: ["L'inclusion profite à tout le groupe.", "Un aménagement ne retire pas l'exigence : il enlève un obstacle.", "Le formateur peut demander à la personne ce qui l'aide, sans supposer."],
  gl: [["Inclusion", "Le système s'adapte à la diversité."], ["Accessibilité", "Possibilité pour tous d'accéder aux lieux, contenus et services."], ["Handicap", "Limitation de participation née de la rencontre entre une déficience et un environnement."], ["Aménagement raisonnable", "Adaptation proportionnée qui lève un obstacle."], ["CUA / UDL", "Conception universelle de l'apprentissage."], ["Texte alternatif", "Description textuelle d'une image."], ["Dys", "Troubles spécifiques des apprentissages : dyslexie, dyspraxie…"], ["Barrière", "Obstacle à la participation."]],
